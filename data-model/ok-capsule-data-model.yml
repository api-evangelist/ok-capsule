note: >-
  Derived from the 51 components.schemas in the v2 OpenAPI by walking allOf-composed property sets and
  reading id-reference fields. The spec uses no $ref-typed properties between resources at all - every
  relationship is expressed as a flat `<entity>_id` UUID field - so the graph below is reconstructed
  from naming, cross-checked against the "Core Concepts" table in info.description and the docs. The
  glossary terms (Client, Consumer, Order, Order Line, Pouch, Fulfillment, Assembly, Product Line, OKC
  Product, User, Contact) are the provider's own.
identifiers:
  style: uuid
  prefixes: none
  note: >-
    No typed id prefixes. Every id is a bare UUID, so an id alone does not tell an agent what kind of
    thing it points at. Several entities also carry caller-supplied correlation ids
    (client_custom_order_id, client_custom_consumer_id, client_custom_product_id,
    client_custom_order_line_id) and an external `crm_id` that appears on 15 of the 51 schemas.
root_entity: Client
entities:
- name: Client
  route: /v2/clients
  description: The organization - a business partner submitting orders. The tenancy root; almost every other entity hangs off it.
  external_ids: [tax_id, stripe_customer_id, crm_account_id, crm_id]
- name: User
  route: /v2/users
  description: An authorized person who accesses the API or portal.
- name: Contact
  route: /v2/contacts
  description: A person associated with a client, managed for communication purposes.
- name: Address
  route: /v2/addresses
  description: A polymorphic address record that can belong to a client, a consumer or a contact.
- name: Consumer
  route: /v2/consumers
  description: The end customer receiving the supplement packs.
- name: ConsumerAddress
  route: /v2/consumers/{consumerId}/addresses
- name: ContactAddress
  route: /v2/contacts/{contactId}/addresses
- name: ProductLine
  route: /v2/product-lines
  description: A client's marketing brand; appears on the packaging.
- name: OkcProduct
  route: /v2/okc-products
  description: A supplement in the OK Capsule master catalog - what OK Capsule purchases from vendors.
- name: Product
  route: /v2/products
  description: A client product - the client's own catalog entry, mapped onto an OKC product.
- name: Assembly
  route: /v2/assemblies
  description: A client's predefined bundle of products, commonly called a "pack".
- name: PackagingAssetGroup
  route: /v2/packaging-asset-groups
  description: The packaging design (labels, pamphlet, pouch template). An order line requires an Active PAG or it lands in Needs Changes.
- name: Order
  route: /v2/orders
  description: A request for one or more packs to be manufactured and shipped.
- name: OrderLine
  route: /v2/order-lines
  description: A single pack within an order - a duration (e.g. 30 days) of pouches.
- name: Pouch
  route: null
  description: An individual daily packet of supplements. Not addressable as its own resource; it is a nested structure inside an order line.
- name: Fulfillment
  route: /v2/fulfillments
  description: Shipping, tracking and delivery information for an order.
- name: Batch
  route: /v2/batches
  description: A manufacturing batch, linked to a billing record.
- name: Billing
  route: /v2/billings
- name: Status
  route: /v2/statuses
  description: The status vocabulary for orders and fulfillments.
- name: OrderTransactionLogs
  route: /v2/order-transaction-logs
  description: Event history for an order. Generic - carries an entity_id rather than a typed order_id.
- name: PackBuilder
  route: /v2/pack-builders
  description: A configured consumer-facing pack-building widget.
- name: PackBuilderCategory
  route: /v2/pack-builders/categories
- name: Cart
  route: /v2/pack-builders/carts
  description: A pack-builder cart, which becomes an order.
- name: ClientProductSetItem
  route: /v2/product-sets
- name: UpcCode
  route: /v2/upc-codes
  description: A GS1 UPC product identifier, attachable to OKC products.
- name: SyncProcess
  route: /v2/sync-processes
  description: A product-sync run pushing catalog to a destination such as Shopify.
- name: ClientPrinterSettings
  route: /v2/client-printer-settings
- name: Telemetry
  route: /v2/telemetry
