tags:
- name: Product Lines
  description: Routes to manage product lines (formerly brands).
paths:
  /v2/product-lines:
    post:
      tags:
      - Product Lines
      security:
      - bearerAuth:
        - product_lines/write
      summary: Creates a product line.
      operationId: createProductLine
      description: Creates a product line.
      parameters:
      - in: query
        name: q
        description: For internal users only. Use Query DSL *query_string* syntax to send client id.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - address_id
              - shipping_notification_email
              - display_name
              - send_tracking_to_client_shipping_contact
              - send_tracking_to_consumer
              properties:
                address_id:
                  type: string
                  format: uuid
                  example: d290f1ee-6c54-4b01-90e6-d701748f0851
                shipping_notification_email:
                  type: string
                  example: email@example.com
                display_name:
                  type: string
                  maxLength: 20
                  example: Akeso Supplements
                description:
                  type: string
                  example: Healthiest supplements in the lands between
                send_tracking_to_client_shipping_contact:
                  type: boolean
                send_tracking_to_consumer:
                  type: boolean
                box_color:
                  type:
                  - string
                  - 'null'
                  example: White
                sticker_finish:
                  type:
                  - string
                  - 'null'
                  example: Matte
                default_packaging_asset_group_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  example: c6de9100-e8b2-4032-80e2-3743deda83d2
                name:
                  type:
                  - string
                  - 'null'
                  example: Akseo
                  x-internal: true
                  description: This field is filtered for client users.
                status:
                  type: string
                  enum:
                  - Never Launched
                  - On Hold
                  - Retired
                  - Shipping
                  - Onboarding
                  - Testing
                  - Pre-Sale
                  x-internal: true
                  description: This field is filtered for client users.
                pouch_material:
                  type: string
                  enum:
                  - Eco/Compostable
                  - Plastic
                  example: Plastic
                  x-internal: true
                  description: This field is filtered for client users.
                fulfillment_fee:
                  type: object
                  x-internal: true
                  description: This field is filtered for client users.
                shipping_fee:
                  type: object
                  x-internal: true
                  description: This field is filtered for client users.
                fulfillment_fee_kitting:
                  type: object
                  x-internal: true
                  description: This field is filtered for client users.
                shipping_fee_kitting:
                  type: object
                  x-internal: true
                  description: This field is filtered for client users.
                pamphlet_template_pages_count:
                  type: integer
                  x-internal: true
                  description: This field is filtered for client users.
                additional_pouch_count:
                  type: integer
                  x-internal: true
                  description: This field is filtered for client users.
                enforce_orderline_consolidation:
                  type:
                  - boolean
                  - 'null'
                  x-internal: true
                  description: This field is filtered for client users.
                default_orderline_duration:
                  type:
                  - integer
                  - 'null'
                  x-internal: true
                  description: This field is filtered for client users.
                pill_per_pouch_overflow_strategy:
                  type:
                  - string
                  - 'null'
                  x-internal: true
                  description: This field is filtered for client users.
                shipping_tier:
                  type:
                  - string
                  - 'null'
                  x-internal: true
                  description: This field is filtered for client users.
                carrier_service_group:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  x-internal: true
                  description: This field is filtered for client users.
                crm_id:
                  type: string
                  x-internal: true
                  description: This field is filtered for client users.
            examples:
              ProductLineFullSample:
                summary: Creates product lines with all fields
                $ref: '#/components/examples/ProductLineFullSample'
      responses:
        '201':
          description: Returns a created product line.
          content:
            application/json:
              schema:
                type: object
                properties:
                  product_line:
                    $ref: '#/components/schemas/ProductLine'
        '422':
          $ref: '#/components/responses/422ValidationError'
        default:
          $ref: '#/components/responses/UnknownError'
    get:
      tags:
      - Product Lines
      security:
      - bearerAuth:
        - product_lines/read
      summary: List product lines.
      operationId: listProductLines
      description: 'List product lines.


        Filterable fields:

        * name

        * display_name

        * status

        * pouch_material

        * crm_id


        Sortable fields:

        * display_name

        '
      parameters:
      - $ref: '#/components/parameters/LimitParameters'
      - $ref: '#/components/parameters/CursorParameters'
      - $ref: '#/components/parameters/SortByParameters'
      - $ref: '#/components/parameters/QueryParameters'
      responses:
        '200':
          description: Search results matching criteria
          content:
            application/json:
              schema:
                type: object
                required:
                - product_lines
                properties:
                  product_lines:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductLine'
        default:
          $ref: '#/components/responses/UnknownError'
  /v2/product-lines/count:
    get:
      tags:
      - Product Lines
      security:
      - bearerAuth:
        - product_lines/read
      summary: Count of all product_lines
      operationId: getProductLineTotalCount
      description: "Count of all product_lines.\n\n   Filterable fields:\n   * name\n   * display_name\n   * status\n   * pouch_material\n   * crm_id\n"
      parameters:
      - $ref: '#/components/parameters/QueryParameters'
      responses:
        '200':
          description: Search results matching criteria
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/Count'
        default:
          $ref: '#/components/responses/UnknownError'
