      - Product Lines
      security:
      - bearerAuth:
        - product_lines/write
      summary: Update a product line.
      operationId: updateProductLine
      description: Update a product line.
      parameters:
      - $ref: '#/components/parameters/IdParameter'
      - in: query
        name: q
        description: For internal users only. Use Query DSL *query_string* syntax to send client id.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                address_id:
                  type: string
                  format: uuid
                  example: d290f1ee-6c54-4b01-90e6-d701748f0851
                shipping_notification_email:
                  type: string
                  example: email@example.com
                display_name:
                  type: string
                  maxLength: 20
                  example: Akeso Supplements
                description:
                  type:
                  - string
                  - 'null'
                  example: Healthiest supplements in the lands between
                send_tracking_to_client_shipping_contact:
                  type: boolean
                send_tracking_to_consumer:
                  type: boolean
                box_color:
                  type:
                  - string
                  - 'null'
                  example: White
                sticker_finish:
                  type:
                  - string
                  - 'null'
                  example: Matte
                default_packaging_asset_group_id:
                  type:
                  - string
                  - 'null'
                  format: uuid
                  example: c6de9100-e8b2-4032-80e2-3743deda83d2
                name:
                  type:
                  - string
                  - 'null'
                  example: Akseo
                  x-internal: true
                  description: This field is filtered for client users.
                status:
                  type: string
                  enum:
                  - Never Launched
                  - On Hold
                  - Retired
                  - Shipping
                  - Onboarding
                  - Testing
                  - Pre-Sale
                  x-internal: true
                  description: This field is filtered for client users.
                pouch_material:
                  type: string
                  enum:
                  - Eco/Compostable
                  - Plastic
                  example: Plastic
                  x-internal: true
                  description: This field is filtered for client users.
                fulfillment_fee:
                  type: object
                  x-internal: true
                  description: This field is filtered for client users.
                shipping_fee:
                  type: object
                  x-internal: true
                  description: This field is filtered for client users.
                fulfillment_fee_kitting:
                  type: object
                  x-internal: true
                  description: This field is filtered for client users.
                shipping_fee_kitting:
                  type: object
                  x-internal: true
                  description: This field is filtered for client users.
                pamphlet_template_pages_count:
                  type: integer
                  x-internal: true
                  description: This field is filtered for client users.
                additional_pouch_count:
                  type: integer
                  x-internal: true
                  description: This field is filtered for client users.
                enforce_orderline_consolidation:
                  type:
                  - boolean
                  - 'null'
                  x-internal: true
                  description: This field is filtered for client users.
                default_orderline_duration:
                  type:
                  - integer
                  - 'null'
                  x-internal: true
                  description: This field is filtered for client users.
                pill_per_pouch_overflow_strategy:
                  type:
                  - string
                  - 'null'
                  x-internal: true
                  description: This field is filtered for client users.
                shipping_tier:
                  type:
                  - string
                  - 'null'
                  x-internal: true
                  description: This field is filtered for client users.
                carrier_service_group:
                  type: string
                  format: uuid
                  x-internal: true
                  description: This field is filtered for client users.
                crm_id:
                  type: string
                  x-internal: true
                  description: This field is filtered for client users.
        description: Product line to add
      responses:
        '200':
          description: Returns the updated product line.
          content:
            application/json:
              schema:
                type: object
                properties:
                  product_line:
                    $ref: '#/components/schemas/ProductLine'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: Validation error response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
    delete:
      tags:
      - Product Lines
      security:
      - bearerAuth:
        - product_lines/write
      summary: Delete a product line.
      operationId: deleteProductLine
      description: Delete a product line.
      parameters:
      - $ref: '#/components/parameters/IdParameter'
      - in: query
        name: q
        description: For internal users only. Use Query DSL *query_string* syntax to send client id.
        schema:
          type: string
      responses:
        '204':
          description: Confirms deletion of a product line.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
  /v2/product-lines/{id}/packaging-asset-groups:
    get:
      tags:
      - Product Lines
      security:
      - bearerAuth:
        - product_lines/read
      summary: Get a Packaging Asset Group attached to product line.
      operationId: getPackagingAssetGroupProductLine
      description: Get a Packaging Asset Group attached to product line.
      parameters:
      - $ref: '#/components/parameters/IdParameter'
      - in: query
        name: q
        description: For internal users only. Use Query DSL *query_string* syntax to send client id.
        schema:
          type: string
      responses:
        '200':
          description: Search results matching criteria.
          content:
            application/json:
              schema:
                type: object
                properties:
                  packaging_asset_group:
                    $ref: '#/components/schemas/PackagingAssetGroup'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
components:
  parameters:
    SortByParameters:
      in: query
      name: sort_by
      description: Sort values by a specific property. See available sort by values in the table.
      schema:
        type: string
    QueryParameters:
      in: query
      name: q
      description: Use Query DSL *query_string* syntax
      schema:
        type: string
    LimitParameters:
      in: query
      name: limit
      description: Number of results to return. Default 50, max 250.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 250
    CursorParameters:
      in: query
      name: cursor
      description: Return results before/after a specific record.
      schema:
        type: string
    IdParameter:
      in: path
      name: id
      required: true
      schema:
        type: string
        minimum: 1
  responses:
    422ValidationError:
      description: Validation error response.
      content:
        application/json:
          schema:
            type: object
            title: Validation Error
            required:
            - message
            - errors
            description: A validation error response from the OK Capsule API (Joi validation)
            properties:
              message:
                description: A human-readable message indicating a validation error occurred.
                maxLength: 40000
                type: string
                example: Validation error
              errors:
                description: An array of validation errors from Joi schema validation
                type: array
                items:
                  type: object
                  required:
                  - message
                  - type
                  properties:
                    message:
                      description: A human-readable message providing more details about the validation error.
                      type: string
                      example: '''business_name'' is required'
                    type:
                      description: The Joi validation type that failed.
                      type: string
                      example: any.required
    UnknownError:
      description: Error response.
      content:
        application/json:
          schema:
            title: Error Model
            description: An error response from the OK Capsule API
            type: object
            properties:
              error:
                title: Error Model Content
                type: object
                description: Error details object
                required:
                - message
                properties:
                  errorCode:
                    description: For some errors that could be handled programmatically, a short string indicating the error code.
                    maxLength: 5000
                    type: string
                    example: RESOURCE_NOT_FOUND
                  message:
                    description: A human-readable message providing more details about the error.
                    maxLength: 40000
                    type: string
                    example: The requested resource was not found
              message:
                description: Top-level error message (present in some error responses)
                type: string
                example: Internal Server Error
            required:
            - error
  schemas:
    ProductLine:
      allOf:
      - allOf:
        - type: object
          required:
          - created_at
          - updated_at
          properties:
            created_at:
              type: string
              format: date-time
              readOnly: true
              example: '2023-03-20T09:12:28Z'
            updated_at:
              type: string
              format: date-time
              readOnly: true
              example: '2023-03-20T09:12:28Z'
        - type: object
          required:
          - id
          - client_id
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              example: d290f1ee-6c54-4b01-90e6-d701748f0851
            client_id:
              type: string
              format: uuid
              example: d290f1ee-6c54-4b01-90e6-d701748f0851
            status:
              type:
              - string
              - 'null'
              enum:
              - Never Launched
              - On Hold
              - Retired
              - Shipping
              - Onboarding
              - Testing
              - Pre-Sale
              example: Onboarding
            address_id:
              type:
              - string
              - 'null'
              format: uuid
              example: d290f1ee-6c54-4b01-90e6-d701748f0851
            default_packaging_asset_group_id:
              type:
              - string
              - 'null'
              format: uuid
              example: c6de9100-e8b2-4032-80e2-3743deda83d2
            shipping_notification_email:
              type: string
              example: email@example.com
            name:
              type:
              - string
              - 'null'
              example: Akseo
            display_name:
              type: string
              example: Akeso Supplements
            description:
              type:
              - string
              - 'null'
              example: Healthiest supplements in the lands between
            send_tracking_to_client_shipping_contact:
              type: boolean
            send_tracking_to_consumer:
              type: boolean
            pouch_material:
              type: string
              enum:
              - Eco/Compostable
              - Plastic
              example: Plastic
            box_color:
              type:
              - string
              - 'null'
              example: White
            sticker_finish:
              type:
              - string
              - 'null'
              example: Matte
            pamphlet_template_pages_count:
              type:
              - integer
              - 'null'
              x-internal: true
              description: This field is for internal use only.
            additional_pouch_count:
              type:
              - integer
              - 'null'
              x-internal: true
              description: This field is for internal use only.
            enforce_orderline_consolidation:
              type:
              - boolean
              - 'null'
              x-internal: true
              description: This field is for internal use only.
            default_orderline_duration:
              type:
              - integer
              - 'null'
              x-internal: true
              description: This field is for internal use only.
            pill_per_pouch_overflow_strategy:
              type:
              - string
              - 'null'
              x-internal: true
              description: This field is for internal use only.
            shipping_tier:
              type:
              - string
              - 'null'
              x-internal: true
              description: This field is for internal use only.
            carrier_service_group:
              type:
              - string
              - 'null'
              format: uuid
              x-internal: true
              description: This field is for internal use only.
            fulfillment_fee:
              type:
              - object
              - 'null'
              x-internal: true
              description: This field is for internal use only.
            shipping_fee:
              type:
              - object
              - 'null'
              x-internal: true
              description: This field is for internal use only.
            fulfillment_fee_kitting:
              type:
              - object
              - 'null'
              x-internal: true
              description: This field is for internal use only.
            shipping_fee_kitting:
              type:
              - object
              - 'null'
              x-internal: true
              description: This field is for internal use only.
            crm_id:
              type:
              - string
              - 'null'
              example: ABCDE12587AHSNNHS
              x-internal: true
              description: This field is for internal use only.
      - type: object
        required:
        - created_at
        - updated_at
        properties:
          created_at:
            type: string
            format: date-time
            readOnly: true
            example: '2023-03-20T09:12:28Z'
          updated_at:
            type: string
            format: date-time
            readOnly: true
            example: '2023-03-20T09:12:28Z'
    ValidationError:
      type: object
      title: Validation Error
      required:
      - message
      - errors
      description: A validation error response from the OK Capsule API (Joi validation)
      properties:
        message:
          description: A human-readable message indicating a validation error occurred.
          maxLength: 40000
          type: string
          example: Validation error
        errors:
          description: An array of validation errors from Joi schema validation
          type: array
          items:
            type: object
            required:
            - message
            - type
            properties:
              message:
                description: A human-readable message providing more details about the validation error.
                type: string
                example: '''business_name'' is required'
              type:
                description: The Joi validation type that failed.
                type: string
                example: any.required
    ErrorModel:
      title: Error Model
      description: An error response from the OK Capsule API
      type: object
      properties:
        error:
          title: Error Model Content
          type: object
          description: Error details object
          required:
          - message
          properties:
            errorCode:
              description: For some errors that could be handled programmatically, a short string indicating the error code.
              maxLength: 5000
              type: string
              example: RESOURCE_NOT_FOUND
            message:
              description: A human-readable message providing more details about the error.
              maxLength: 40000
              type: string
              example: The requested resource was not found
        message:
          description: Top-level error message (present in some error responses)
          type: string
          example: Internal Server Error
      required:
      - error
    Count:
      allOf:
      - type: object
        properties:
          count:
            type: number
            example: 8
    PackagingAssetGroup:
      allOf:
      - allOf:
        - type: object
          required:
          - created_at
          - updated_at
          properties:
            created_at:
              type: string
              format: date-time
              readOnly: true
              example: '2023-03-20T09:12:28Z'
            updated_at:
              type: string
              format: date-time
              readOnly: true
              example: '2023-03-20T09:12:28Z'
        - type: object
          required:
          - id
          - client_id
          - pamphlet_cover_image_url
          - pamphlet_inside_cover_image_url
          - pamphlet_back_image_url
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              example: d290f1ee-6c54-4b01-90e6-d701748f0851
            client_id:
              type: string
              format: uuid
              example: d290f1ee-6c54-4b01-90e6-d701748f0851
            status:
              type: string
              enum:
              - New
              - Active
              - Testing
              - Onboarding
              - Archived
