openapi: 3.2.0
info:
  description: '## Overview


    The OK Capsule API enables you to programmatically create supplement orders, manage consumers, and track shipments.'
  version: 2.0.0
  title: OKC core API V2 Pack Builder Integration Settings (Private)…
  contact:
    name: Engineering Department, OKCapsule
    email: lukas@okcapsule.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
- description: Production environment
  url: https://na1-prod.okcapsule.app
- description: Stage/Testing environment
  url: https://na1-stage.okcapsule.app
tags:
- name: Pack Builder Integration Settings (Private)
paths:
  /v2/pack-builders/integration-settings:
    post:
      tags:
      - Pack Builder Integration Settings (Private)
      summary: Creates a integration settings
      operationId: createPackBuilderIntegrationSettings
      description: Creates a integration settings.
      security:
      - bearerAuth: []
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - pack_builder_id
              - installation_settings
              description: Create integration settings for a pack builder (e.g., Shopify app settings)
              properties:
                pack_builder_id:
                  type: string
                  format: uuid
                  description: Pack builder to configure
                  example: 3ab920e6-9d59-4f33-aea0-5045f726dafb
                installation_settings:
                  type: object
                  description: Integration-specific settings (structure varies by integration type)
                  example:
                    shop_domain: mystore.myshopify.com
                    access_token: shpat_xxxxx
                    webhook_version: 2024-01
              example:
                pack_builder_id: 3ab920e6-9d59-4f33-aea0-5045f726dafb
                installation_settings:
                  shop_domain: mystore.myshopify.com
              x-examples:
                shopify:
                  summary: Shopify integration settings
                  value:
                    pack_builder_id: 3ab920e6-9d59-4f33-aea0-5045f726dafb
                    installation_settings:
                      shop_domain: mystore.myshopify.com
                      access_token: shpat_xxxxx
                      webhook_version: 2024-01
        description: Pack Builder Integration Settings to create
      responses:
        '201':
          description: Returns created Pack Builder Integration Settings.
          content:
            application/json:
              schema:
                type: object
                required:
                - integration_setting
                properties:
                  integration_setting:
                    $ref: '#/components/schemas/PackBuilderIntegrationSettings'
        '422':
          $ref: '#/components/responses/422ValidationError'
        default:
          $ref: '#/components/responses/UnknownError'
    get:
      tags:
      - Pack Builder Integration Settings (Private)
      security:
      - bearerAuth: []
      summary: List all pack builder integration settings
      operationId: listPackBuilderIntegrationSettings
      description: List all pack builder integration settings.
      parameters:
      - $ref: '#/components/parameters/LimitParameters'
      - $ref: '#/components/parameters/CursorParameters'
      - $ref: '#/components/parameters/SortByParameters'
      - $ref: '#/components/parameters/QueryParameters'
      responses:
        '200':
          description: Search results matching criteria
          content:
            application/json:
              schema:
                type: object
                required:
                - integration_settings
                properties:
                  integration_settings:
                    type: array
                    items:
                      $ref: '#/components/schemas/PackBuilderIntegrationSettings'
        default:
          $ref: '#/components/responses/UnknownError'
  /v2/pack-builders/integration-settings/count:
    get:
      tags:
      - Pack Builder Integration Settings (Private)
      security:
      - bearerAuth:
        - addresses/read
      summary: Count of all integration settings
      operationId: getIntegrationSettingsTotalCount
      parameters:
      - $ref: '#/components/parameters/QueryParameters'
      responses:
        '200':
          description: Search results matching criteria
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/Count'
        default:
          $ref: '#/components/responses/UnknownError'
  /v2/pack-builders/integration-settings/{id}:
    get:
      tags:
      - Pack Builder Integration Settings (Private)
      security:
      - bearerAuth: []
      summary: Retrieves a pack builder integration settings
      operationId: getPackBuilderIntegrationSettings
      parameters:
      - $ref: '#/components/parameters/IdParameter'
      responses:
        '200':
          description: Returns the updated PackBuilderIntegrationSettings object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  integration_setting:
                    $ref: '#/components/schemas/PackBuilderIntegrationSettings'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: Validation error response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
    put:
      tags:
      - Pack Builder Integration Settings (Private)
      security:
      - bearerAuth: []
      summary: Update a pack builder integration settings
      operationId: updatePackBuilderIntegrationSettings
      description: Update a pack builder integration settings.
      parameters:
      - $ref: '#/components/parameters/IdParameter'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - installation_settings
              description: Update integration settings for a pack builder
              properties:
                installation_settings:
                  type: object
                  description: Integration-specific settings (structure varies by integration type)
                  example:
                    webhook_version: 2024-04
              example:
                installation_settings:
                  webhook_version: 2024-04
              x-examples:
                update-settings:
                  summary: Update integration settings
                  value:
                    installation_settings:
                      webhook_version: 2024-04
                      enable_notifications: true
      responses:
        '200':
          description: Returns the updated BuilderIntegrationSettings object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  integration_setting:
                    $ref: '#/components/schemas/PackBuilderIntegrationSettings'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: Validation error response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
    delete:
      tags:
      - Pack Builder Integration Settings (Private)
      security:
      - bearerAuth: []
      summary: Delete a pack builder integration settings
      operationId: deletePackBuilderIntegrationSettings
      parameters:
      - $ref: '#/components/parameters/IdParameter'
      responses:
        '204':
          $ref: '#/components/responses/204ConfirmDeletion'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
components:
  schemas:
    ErrorModel:
      title: Error Model
      description: An error response from the OK Capsule API
      type: object
      properties:
        error:
          title: Error Model Content
          type: object
          description: Error details object
          required:
          - message
          properties:
            errorCode:
              description: For some errors that could be handled programmatically, a short string indicating the error code.
              maxLength: 5000
              type: string
              example: RESOURCE_NOT_FOUND
            message:
              description: A human-readable message providing more details about the error.
              maxLength: 40000
              type: string
              example: The requested resource was not found
        message:
          description: Top-level error message (present in some error responses)
          type: string
          example: Internal Server Error
      required:
      - error
    ValidationError:
      type: object
      title: Validation Error
      required:
      - message
      - errors
      description: A validation error response from the OK Capsule API (Joi validation)
      properties:
        message:
          description: A human-readable message indicating a validation error occurred.
          maxLength: 40000
          type: string
          example: Validation error
        errors:
          description: An array of validation errors from Joi schema validation
          type: array
          items:
            type: object
            required:
            - message
            - type
            properties:
              message:
                description: A human-readable message providing more details about the validation error.
                type: string
                example: '''business_name'' is required'
              type:
                description: The Joi validation type that failed.
                type: string
                example: any.required
    Count:
      allOf:
      - type: object
        properties:
          count:
            type: number
            example: 8
    PackBuilderIntegrationSettings:
      allOf:
      - type: object
        required:
        - id
        - pack_builder_id
        - installation_settings
        properties:
          id:
            type: string
            format: uuid
            example: a0d671e2-591a-42ce-b336-df256262b0d2
          pack_builder_id:
            type: string
            format: uuid
            example: 3ab920e6-9d59-4f33-aea0-5045f726dafb
          installation_settings:
            type: object
      - type: object
        required:
        - created_at
        - updated_at
        properties:
          created_at:
            type: string
            format: date-time
            readOnly: true
            example: '2023-03-20T09:12:28Z'
          updated_at:
            type: string
            format: date-time
            readOnly: true
            example: '2023-03-20T09:12:28Z'
  responses:
    UnknownError:
      description: Error response.
      content:
        application/json:
          schema:
            title: Error Model
            description: An error response from the OK Capsule API
            type: object
            properties:
              error:
                title: Error Model Content
                type: object
                description: Error details object
                required:
                - message
                properties:
                  errorCode:
                    description: For some errors that could be handled programmatically, a short string indicating the error code.
                    maxLength: 5000
                    type: string
                    example: RESOURCE_NOT_FOUND
                  message:
                    description: A human-readable message providing more details about the error.
                    maxLength: 40000
                    type: string
                    example: The requested resource was not found
              message:
                description: Top-level error message (present in some error responses)
                type: string
                example: Internal Server Error
            required:
            - error
    422ValidationError:
      description: Validation error response.
      content:
        application/json:
          schema:
            type: object
            title: Validation Error
            required:
            - message
            - errors
            description: A validation error response from the OK Capsule API (Joi validation)
            properties:
              message:
                description: A human-readable message indicating a validation error occurred.
                maxLength: 40000
                type: string
                example: Validation error
              errors:
                description: An array of validation errors from Joi schema validation
                type: array
                items:
                  type: object
                  required:
                  - message
                  - type
                  properties:
                    message:
                      description: A human-readable message providing more details about the validation error.
                      type: string
                      example: '''business_name'' is required'
                    type:
                      description: The Joi validation type that failed.
                      type: string
                      example: any.required
    204ConfirmDeletion:
      description: Confirms resource deletion.
  parameters:
    LimitParameters:
      in: query
      name: limit
      description: Number of results to return. Default 50, max 250.
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 250
    CursorParameters:
      in: query
      name: cursor
      description: Return results before/after a specific record.
      schema:
        type: string
    QueryParameters:
      in: query
      name: q
      description: Use Query DSL *query_string* syntax
      schema:
        type: string
    IdParameter:
      in: path
      name: id
      required: true
      schema:
        type: string
        minimum: 1
    SortByParameters:
      in: query
      name: sort_by
      description: Sort values by a specific property. See available sort by values in the table.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
