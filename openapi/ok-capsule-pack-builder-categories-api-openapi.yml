openapi: 3.2.0
info:
  description: '## Overview


    The OK Capsule API enables you to programmatically create supplement orders, manage consumers, and track shipments.'
  version: 2.0.0
  title: OKC core API V2 Pack Builder Categories API
  contact:
    name: Engineering Department, OKCapsule
    email: lukas@okcapsule.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
- description: Production environment
  url: https://na1-prod.okcapsule.app
- description: Stage/Testing environment
  url: https://na1-stage.okcapsule.app
tags:
- name: Pack Builder Categories
paths:
  /v2/pack-builders/{id}/categories:
    post:
      tags:
      - Pack Builder Categories
      security:
      - bearerAuth: []
      summary: Add a category to pack builder
      operationId: createPackBuilderCategory
      description: Add a Category to Pack Builder.
      parameters:
      - $ref: '#/components/parameters/IdParameter'
      - in: query
        name: q
        description: For internal users only. Use Query DSL *query_string* syntax to send client id.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - category_name
              - position
              description: Create a category within a pack builder to organize products
              properties:
                category_name:
                  type: string
                  description: Name of the category
                  example: Energy & Focus
                position:
                  type: integer
                  minimum: 0
                  description: Display order position (0-indexed)
                  example: 0
              example:
                category_name: Energy & Focus
                position: 0
              x-examples:
                first-category:
                  summary: Create first category
                  value:
                    category_name: Energy & Focus
                    position: 0
                second-category:
                  summary: Create second category
                  value:
                    category_name: Sleep & Recovery
                    position: 1
            examples:
              PackBuilderCategorySample:
                $ref: '#/components/examples/PackBuilderCategorySample'
      responses:
        '201':
          description: Returns an added Category object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pack_builder_category:
                    $ref: '#/components/schemas/PackBuilderCategory'
        '422':
          $ref: '#/components/responses/422ValidationError'
        default:
          $ref: '#/components/responses/UnknownError'
    get:
      tags:
      - Pack Builder Categories
      security:
      - bearerAuth: []
      summary: List all categories belongs to a pack builder
      operationId: listPackBuildersCategories
      description: List all categories belongs to a pack builder.
      parameters:
      - $ref: '#/components/parameters/IdParameter'
      responses:
        '200':
          description: Search results matching criteria
          content:
            application/json:
              schema:
                type: object
                required:
                - pack_builder_categories
                properties:
                  pack_builder_categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/PackBuilderCategory'
        default:
          $ref: '#/components/responses/UnknownError'
  /v2/pack-builders/{id}/categories/{categoryId}:
    put:
      tags:
      - Pack Builder Categories
      security:
      - bearerAuth: []
      summary: Update a category belongs to pack builder
      operationId: updatePackBuilderCategory
      description: Update a category belongs to pack builder.
      parameters:
      - $ref: '#/components/parameters/IdParameter'
      - in: path
        name: categoryId
        required: true
        schema:
          type: string
          minimum: 1
      - in: query
        name: q
        description: For internal users only. Use Query DSL *query_string* syntax to send client id.
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              description: Update a pack builder category. All fields optional.
              properties:
                category_name:
                  type: string
                  description: Name of the category
                  example: Updated Category Name
                position:
                  type: integer
                  minimum: 0
                  description: Display order position (0-indexed)
                  example: 2
              example:
                category_name: Sleep & Relaxation
              x-examples:
                rename:
                  summary: Rename category
                  value:
                    category_name: Sleep & Relaxation
                reorder:
                  summary: Change position
                  value:
                    position: 3
                complete:
                  summary: Update all fields
                  value:
                    category_name: Immunity & Wellness
                    position: 1
      responses:
        '200':
          description: Returns the updated PackBuilderCategory object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pack_builder_category:
                    $ref: '#/components/schemas/PackBuilderCategory'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: Validation error response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
    delete:
      tags:
      - Pack Builder Categories
      security:
      - bearerAuth: []
      summary: Delete a category belongs to pack builder
      operationId: deletePackBuilderCategory
      description: Delete a category belongs to pack builder.
      parameters:
      - $ref: '#/components/parameters/IdParameter'
      - in: path
        name: categoryId
        required: true
        schema:
          type: string
          minimum: 1
      - in: query
        name: q
        description: For internal users only. Use Query DSL *query_string* syntax to send client id.
        schema:
          type: string
      responses:
        '204':
          $ref: '#/components/responses/204ConfirmDeletion'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
components:
  schemas:
    ErrorModel:
      title: Error Model
      description: An error response from the OK Capsule API
      type: object
      properties:
        error:
          title: Error Model Content
          type: object
          description: Error details object
          required:
          - message
          properties:
            errorCode:
              description: For some errors that could be handled programmatically, a short string indicating the error code.
              maxLength: 5000
              type: string
              example: RESOURCE_NOT_FOUND
            message:
              description: A human-readable message providing more details about the error.
              maxLength: 40000
              type: string
              example: The requested resource was not found
        message:
          description: Top-level error message (present in some error responses)
          type: string
          example: Internal Server Error
      required:
      - error
    PackBuilderCategory:
      allOf:
      - allOf:
        - type: object
          required:
          - created_at
          - updated_at
          properties:
            created_at:
              type: string
              format: date-time
              readOnly: true
              example: '2023-03-20T09:12:28Z'
            updated_at:
              type: string
              format: date-time
              readOnly: true
              example: '2023-03-20T09:12:28Z'
        - type: object
          required:
          - id
          - client_id
          - product_line_id
          - category_name
          properties:
            id:
              type: string
              format: uuid
              example: 69d58301-84c2-447d-9064-3326d14beed7
            client_id:
              type: string
              format: uuid
              example: 29f24a23-68dd-41bb-9aba-f958c10c7d39
            product_line_id:
              type: string
              format: uuid
              example: 4eecd79f-a4a5-4b47-a454-1e32097e5ac0
            category_name:
              type: string
              example: Energy
            position:
              type: number
              example: 2
      - type: object
        required:
        - created_at
        - updated_at
        properties:
          created_at:
            type: string
            format: date-time
            readOnly: true
            example: '2023-03-20T09:12:28Z'
          updated_at:
            type: string
            format: date-time
            readOnly: true
            example: '2023-03-20T09:12:28Z'
    ValidationError:
      type: object
      title: Validation Error
      required:
      - message
      - errors
      description: A validation error response from the OK Capsule API (Joi validation)
      properties:
        message:
          description: A human-readable message indicating a validation error occurred.
          maxLength: 40000
          type: string
          example: Validation error
        errors:
          description: An array of validation errors from Joi schema validation
          type: array
          items:
            type: object
            required:
            - message
            - type
            properties:
              message:
                description: A human-readable message providing more details about the validation error.
                type: string
                example: '''business_name'' is required'
              type:
                description: The Joi validation type that failed.
                type: string
                example: any.required
  examples:
    PackBuilderCategorySample:
      summary: Create pack builder category.
      value:
        category_name: Energy
        position: 2
  responses:
    UnknownError:
      description: Error response.
      content:
        application/json:
          schema:
            title: Error Model
            description: An error response from the OK Capsule API
            type: object
            properties:
              error:
                title: Error Model Content
                type: object
                description: Error details object
                required:
                - message
                properties:
                  errorCode:
                    description: For some errors that could be handled programmatically, a short string indicating the error code.
                    maxLength: 5000
                    type: string
                    example: RESOURCE_NOT_FOUND
                  message:
                    description: A human-readable message providing more details about the error.
                    maxLength: 40000
                    type: string
                    example: The requested resource was not found
              message:
                description: Top-level error message (present in some error responses)
                type: string
                example: Internal Server Error
            required:
            - error
    422ValidationError:
      description: Validation error response.
      content:
        application/json:
          schema:
            type: object
            title: Validation Error
            required:
            - message
            - errors
            description: A validation error response from the OK Capsule API (Joi validation)
            properties:
              message:
                description: A human-readable message indicating a validation error occurred.
                maxLength: 40000
                type: string
                example: Validation error
              errors:
                description: An array of validation errors from Joi schema validation
                type: array
                items:
                  type: object
                  required:
                  - message
                  - type
                  properties:
                    message:
                      description: A human-readable message providing more details about the validation error.
                      type: string
                      example: '''business_name'' is required'
                    type:
                      description: The Joi validation type that failed.
                      type: string
                      example: any.required
    204ConfirmDeletion:
      description: Confirms resource deletion.
  parameters:
    IdParameter:
      in: path
      name: id
      required: true
      schema:
        type: string
        minimum: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
