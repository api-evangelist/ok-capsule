openapi: 3.2.0
info:
  description: '## Overview


    The OK Capsule API enables you to programmatically create supplement orders, manage consumers, and track shipments.'
  version: 2.0.0
  title: OKC core API V2 Pack Builder Widget API
  contact:
    name: Engineering Department, OKCapsule
    email: lukas@okcapsule.com
  license:
    name: Apache 2.0
    url: https://www.apache.org/licenses/LICENSE-2.0.html
servers:
- description: Production environment
  url: https://na1-prod.okcapsule.app
- description: Stage/Testing environment
  url: https://na1-stage.okcapsule.app
tags:
- name: Pack Builder Widget
paths:
  /v2/pack-builders/{id}/widget:
    get:
      tags:
      - Pack Builder Widget
      security:
      - bearerAuth: []
      summary: Retrieves a pack builder widget
      operationId: getPackBuilderWidget
      description: Retrieves PackBuilderWidget object
      parameters:
      - $ref: '#/components/parameters/IdParameter'
      responses:
        '200':
          description: Returns the updated PackBuilderWidget object.
          content:
            application/json:
              schema:
                type: object
                properties: null
                $ref: '#/components/schemas/PackBuilderWidget'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: Validation error response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
  /v2/pack-builders/{id}/widget/products:
    get:
      tags:
      - Pack Builder Widget
      security:
      - bearerAuth: []
      summary: Retrieves a pack builder widget
      operationId: getPackBuilderWidgetProducts
      description: Retrieves PackBuilderWidgetProducts object
      parameters:
      - $ref: '#/components/parameters/IdParameter'
      - $ref: '#/components/parameters/CursorParameters'
      responses:
        '200':
          description: Returns the PackBuilderWidgetProducts object.
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/PackBuilderCategoriesProductsResponse'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: Validation error response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
  /v2/pack-builders/{id}/widget/categories-products:
    get:
      tags:
      - Pack Builder Widget
      security:
      - bearerAuth: []
      summary: Retrieves a pack builder widget categories products
      operationId: getPackBuilderWidgetCategoriesProducts
      description: Retrieves PackBuilderWidgetCategoriesProducts object
      parameters:
      - $ref: '#/components/parameters/IdParameter'
      responses:
        '200':
          description: Returns the PackBuilderCategoriesProducts object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  pack_builder_category_products:
                    type: array
                    items:
                      $ref: '#/components/schemas/PackBuilderCategoriesProducts'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: Validation error response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
  /v2/pack-builders/{id}/widget/categories:
    get:
      tags:
      - Pack Builder Widget
      security:
      - bearerAuth: []
      summary: Retrieves a pack builder widget
      operationId: getPackBuilderWidgetCategories
      description: Retrieves PackBuilderCategories object
      parameters:
      - $ref: '#/components/parameters/IdParameter'
      responses:
        '200':
          description: Search results matching criteria
          content:
            application/json:
              schema:
                type: object
                required:
                - pack_builder_categories
                properties:
                  pack_builder_categories:
                    type: array
                    items:
                      $ref: '#/components/schemas/PackBuilderCategoryWidget'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: Validation error response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
  /v2/pack-builders/{id}/widget/categories/{categoryId}/products:
    get:
      tags:
      - Pack Builder Widget
      security:
      - bearerAuth: []
      summary: Retrieves a pack builder widget
      operationId: getPackBuilderWidgetProductsCategories
      description: Retrieves PackBuilderProducts object
      parameters:
      - $ref: '#/components/parameters/IdParameter'
      - in: path
        name: categoryId
        required: true
        schema:
          type: string
          minimum: 1
      responses:
        '200':
          description: Returns the PackBuilderWidgetProducts object.
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/PackBuilderCategoriesProductsResponse'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: Validation error response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
components:
  schemas:
    ErrorModel:
      title: Error Model
      description: An error response from the OK Capsule API
      type: object
      properties:
        error:
          title: Error Model Content
          type: object
          description: Error details object
          required:
          - message
          properties:
            errorCode:
              description: For some errors that could be handled programmatically, a short string indicating the error code.
              maxLength: 5000
              type: string
              example: RESOURCE_NOT_FOUND
            message:
              description: A human-readable message providing more details about the error.
              maxLength: 40000
              type: string
              example: The requested resource was not found
        message:
          description: Top-level error message (present in some error responses)
          type: string
          example: Internal Server Error
      required:
      - error
    PackBuilderWidget:
      allOf:
      - type: object
        required:
        - id
        - pack_builder_id
        - category_settings
        - visual_settings
        properties:
          pack_builder:
            type: object
            properties:
              id:
                type: string
                format: uuid
                example: 47e4f05e-dc3c-4353-9dec-64139c65cddf
              name:
                type: string
                example: Pack Builder Test
              description:
                type: string
                example: additional data / store name
              type:
                enum:
                - API
                - Shopify
                - BigCommerce
                type: string
                example: API
              checkout_url:
                type: string
                format: url
                example: https://www.vitaminshop.com/checkout
              admin_link:
                type: string
                format: url
                example: https://admin.shopify.com/store/my-store-name
          category_settings:
            type: object
            required:
            - enable_product_categories
            - category_selection_behavior
            - category_menu_selection_behavior
            - category_menu_text_align
            properties:
              enable_product_categories:
                type: boolean
                example: true
              category_selection_behavior:
                type: string
                enum:
                - scroll
                - filter
                example: scroll
              category_menu_selection_behavior:
                type: string
                enum:
                - bold
                - underline
                - fill
                example: bold
              category_menu_text_align:
                type: string
                enum:
                - left
                - center
                - right
                example: left
          visual_settings:
            type: object
            required:
            - layout
            - product_cards
            - typography
            - colors
            - buttons
            - copy
            properties:
              layout:
                type: object
                required:
                - product_view
                - screen_width
                - drawer_settings
                - modal_mode
                - override
                properties:
                  product_view:
                    type: string
                    enum:
                    - grid
                    - list
                    example: grid
                  screen_width:
                    type: string
                    enum:
                    - fixed
                    - flex
                    example: fixed
                  drawer_settings:
                    type: string
                    enum:
                    - temporary
                    - permanent
                    example: permanent
                  modal_mode:
                    type: string
                    enum:
                    - basic
                    - advanced
                    example: basic
                  override:
                    type: boolean
                    example: false
              product_cards:
                type: object
                required:
                - image_aspect_ratio
                - image_corners
                - cycle_length
                - show_icon_labels
                - cart_item_spacing_style
                - override
                properties:
                  image_aspect_ratio:
                    type: string
                    enum:
                    - '1:1'
                    - '4:3'
                    example: '1:1'
                  image_corners:
                    type: string
                    enum:
                    - rounded
                    - square
                    example: rounded
                  cycle_length:
                    type: number
                    enum:
                    - 7
                    - 10
                    example: 7
                  show_icon_labels:
                    type: boolean
                    example: false
                  cart_item_spacing_style:
                    type: string
                    enum:
                    - default
                    - compact
                    - comfortable
                    example: compact
                  override:
                    type: boolean
                    example: false
              typography:
                type: object
                required:
                - text_size
                - header_font
                - body_font
                - link_style
                - override
                properties:
                  text_size:
                    type: string
                    enum:
                    - small
                    - medium
                    - large
                    example: small
                  header_font:
                    type: object
                    required:
                    - font_family
                    - font_weight
                    properties:
                      font_family:
                        type: string
                        example: Open Sand
                      font_weight:
                        type: string
                        example: bold
                  body_font:
                    type: object
                    required:
                    - font_family
                    - font_weight
                    properties:
                      font_family:
                        type: string
                        example: Open Sand
                      font_weight:
                        type: string
                        example: regular
                  link_style:
                    type: string
                    enum:
                    - underline
                    - bold
                    - normal
                    example: underline
                  override:
                    type: boolean
                    example: false
              colors:
                type: object
                required:
                - primary_fill
                - secondary_fill
                - buttons
                - icons
                - header_text
                - body_text
                - links
                - dividers
                - override
                properties:
                  primary_fill:
                    type: string
                    example: '#000000'
                  secondary_fill:
                    type: string
                    example: '#000000'
                  buttons:
                    type: string
                    example: '#000000'
                  icons:
                    type: string
                    example: '#000000'
                  header_text:
                    type: string
                    example: '#000000'
                  body_text:
                    type: string
                    example: '#000000'
                  links:
                    type: string
                    example: '#000000'
                  dividers:
                    type: string
                    example: '#000000'
                  override:
                    type: boolean
                    example: false
              buttons:
                type: object
                required:
                - corner_style
                - ripple_effect
                - checkout_button_text
                - override
                properties:
                  corner_style:
                    type: string
                    enum:
                    - square
                    - round
                    - soft
                    example: round
                  ripple_effect:
                    type: boolean
                    example: false
                  checkout_button_text:
                    type: string
                    example: ''
                  override:
                    type: boolean
                    example: false
              copy:
                type: object
                required:
                - empty_cart_message
                - error_message
                properties:
                  empty_cart_message:
                    type: string
                    example: ''
                  error_message:
                    type: string
                    example: ''
      - type: object
        required:
        - created_at
        - updated_at
        properties:
          created_at:
            type: string
            format: date-time
            readOnly: true
            example: '2023-03-20T09:12:28Z'
          updated_at:
            type: string
            format: date-time
            readOnly: true
            example: '2023-03-20T09:12:28Z'
    PackBuilderCategoriesProductsResponse:
      allOf:
      - type: object
        properties:
          pack_builder_products:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: d290f1ee-6c54-4b01-90e6-d701748f0851
                client_product_id:
                  type: string
                  format: uuid
                  example: c5cbabe9-6ec9-4f1e-84a3-11cdd691cd95
                product_id:
                  type: string
                  format: uuid
                  example: 28a3c700-a794-4ba9-9690-6d91ecc9b36e
                name:
                  type: string
                price_per_pill:
                  type: number
                description:
                  type: string
                image:
                  type: string
                  example: ''
                time_of_administration:
                  type: string
                  enum:
                  - Morning
                  - Midday
                  - Evening
                  example: Morning
                serving_size:
                  type: integer
                  example: 1
                pill_type:
                  type: string
                  example: Capsule(s)
                product_status:
                  type: string
                  example: active
                client_product_active:
                  type: boolean
                  example: true
          next_cursor:
            type: string
            example: 
          prev_cursor:
            type: string
            example: 
    ValidationError:
      type: object
      title: Validation Error
      required:
      - message
      - errors
      description: A validation error response from the OK Capsule API (Joi validation)
      properties:
        message:
          description: A human-readable message indicating a validation error occurred.
          maxLength: 40000
          type: string
          example: Validation error
        errors:
          description: An array of validation errors from Joi schema validation
          type: array
          items:
            type: object
            required:
            - message
            - type
            properties:
              message:
                description: A human-readable message providing more details about the validation error.
                type: string
                example: '''business_name'' is required'
              type:
                description: The Joi validation type that failed.
                type: string
                example: any.required
    PackBuilderCategoriesProducts:
      allOf:
      - type: object
        required:
        - id
        - client_id
        - product_line
        - category_name
        - products
        properties:
          id:
            type: string
            format: uuid
            example: d290f1ee-6c54-4b01-90e6-d701748f0851
          category_name:
            type: string
            example: Energy
          products:
            type: array
            items:
              type: object
              properties:
                id:
                  type: string
                  format: uuid
                  example: d290f1ee-6c54-4b01-90e6-d701748f0851
                client_product_id:
                  type: string
                  format: uuid
                  example: c5cbabe9-6ec9-4f1e-84a3-11cdd691cd95
                product_id:
                  type: string
                  format: uuid
                  example: 28a3c700-a794-4ba9-9690-6d91ecc9b36e
                name:
                  type: string
                price_per_pill:
                  type: number
                description:
                  type: string
                image:
                  type: string
                  example: ''
                time_of_administration:
                  type: string
                  enum:
                  - Morning
                  - Midday
                  - Evening
                  example: Morning
                serving_size:
                  type: integer
                  example: 1
                pill_type:
                  type: string
                  example: Capsule(s)
                product_status:
                  type: string
                  example: active
                client_product_active:
                  type: boolean
                  example: true
      - type: object
        required:
        - created_at
        - updated_at
        properties:
          created_at:
            type: string
            format: date-time
            readOnly: true
            example: '2023-03-20T09:12:28Z'
          updated_at:
            type: string
            format: date-time
            readOnly: true
            example: '2023-03-20T09:12:28Z'
    PackBuilderCategoryWidget:
      allOf:
      - type: object
        required:
        - id
        - client_id
        - product_line
        - category_name
        properties:
          id:
            type: string
            format: uuid
            example: 69d58301-84c2-447d-9064-3326d14beed7
          category_name:
            type: string
            example: Energy
          position:
            type: number
            example: 2
      - type: object
        required:
        - created_at
        - updated_at
        properties:
          created_at:
            type: string
            format: date-time
            readOnly: true
            example: '2023-03-20T09:12:28Z'
          updated_at:
            type: string
            format: date-time
            readOnly: true
            example: '2023-03-20T09:12:28Z'
  parameters:
    CursorParameters:
      in: query
      name: cursor
      description: Return results before/after a specific record.
      schema:
        type: string
    IdParameter:
      in: path
      name: id
      required: true
      schema:
        type: string
        minimum: 1
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
