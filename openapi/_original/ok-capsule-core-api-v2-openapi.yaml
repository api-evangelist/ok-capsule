  /v2/pack-builders/carts:
    post:
      tags:
        - Pack Builder Cart
      summary: Creates a pack builder widget cart.
      operationId: createPackBuilderWidgetCart
      description: Creates a pack builder widget cart.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - pack_builder_id
                - cart_lines
              description: Create a shopping cart for pack builder widget
              properties:
                pack_builder_id:
                  type: string
                  format: uuid
                  description: Pack builder ID
                  example: 8e697e7e-02eb-4a2c-8234-5b6298a56c44
                cart_lines:
                  type: array
                  description: Products in the cart
                  items:
                    type: object
                    required:
                      - product_id
                      - time_of_administration
                      - cycle
                      - cycle_length
                      - serving_size
                    properties:
                      product_id:
                        type: string
                        format: uuid
                        description: Client product ID
                        example: 142c9cf7-c665-4beb-a24f-79f68334d232
                      time_of_administration:
                        type: string
                        enum:
                          - Morning
                          - Midday
                          - Evening
                        description: When to take
                        example: Morning
                      cycle:
                        type: string
                        description: >-
                          Dosing cycle - "daily" or semicolon-delimited days
                          (e.g., "1;3;5;7")
                        example: daily
                      cycle_length:
                        type: integer
                        enum:
                          - 7
                          - 10
                        description: Cycle length in days
                        example: 7
                      serving_size:
                        type: integer
                        minimum: 1
                        description: Number of pills/units per serving
                        example: 2
                      duration:
                        type: integer
                        description: Duration in days
                        example: 30
              example:
                pack_builder_id: 8e697e7e-02eb-4a2c-8234-5b6298a56c44
                cart_lines:
                  - product_id: 142c9cf7-c665-4beb-a24f-79f68334d232
                    time_of_administration: Morning
                    cycle: daily
                    cycle_length: 7
                    serving_size: 2
              x-examples:
                single-product:
                  summary: Cart with single product
                  value:
                    pack_builder_id: 8e697e7e-02eb-4a2c-8234-5b6298a56c44
                    cart_lines:
                      - product_id: 142c9cf7-c665-4beb-a24f-79f68334d232
                        time_of_administration: Morning
                        cycle: daily
                        cycle_length: 7
                        serving_size: 2
                        duration: 30
                multiple-products:
                  summary: Cart with multiple products
                  value:
                    pack_builder_id: 8e697e7e-02eb-4a2c-8234-5b6298a56c44
                    cart_lines:
                      - product_id: 142c9cf7-c665-4beb-a24f-79f68334d232
                        time_of_administration: Morning
                        cycle: daily
                        cycle_length: 7
                        serving_size: 2
                        duration: 30
                      - product_id: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                        time_of_administration: Evening
                        cycle: daily
                        cycle_length: 7
                        serving_size: 1
                        duration: 30
                custom-cycle:
                  summary: Cart with custom dosing cycle
                  value:
                    pack_builder_id: 8e697e7e-02eb-4a2c-8234-5b6298a56c44
                    cart_lines:
                      - product_id: 142c9cf7-c665-4beb-a24f-79f68334d232
                        time_of_administration: Morning
                        cycle: 1;3;5;7
                        cycle_length: 7
                        serving_size: 1
      responses:
        '201':
          description: Returns the created Cart object.
          content:
            application/json:
              schema:
                type: object
                required:
                  - cart
                properties:
                  cart:
                    $ref: '#/components/schemas/Cart'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: Validation error response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
