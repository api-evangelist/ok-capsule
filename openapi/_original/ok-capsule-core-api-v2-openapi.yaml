tags:
  - name: Authentication
    description: >-
      OK Capsule API uses **Oauth2.0 with OpenID Connect**. It issues
      **access**, **id**, and **refresh** tokens. **Access** tokens is used to
      authenticate API requests and are short lived (1 day). *Id token** can be
      used by a client application to display user's information. It is also
      short lived (1 day).  **Refresh** token is long lived (10 years) and is
      used to renew **access** and **id** tokens. Authentication to the API is
      performed via Bearer auth Authorization header: *Authorization: Bearer
      <access_token>*.
  - name: Assemblies
    description: Routes to manage assemblies (formerly packs)
  - name: Batches
    description: Routes to manage batches
  - name: Billings
    description: Routes to manage billing
  - name: Client Addresses
    description: Routes to manage client addresses
  - name: Clients
    description: Routes to manage clients
  - name: Consumer Addresses
    description: Routes to manage consumer addresses
  - name: Consumers
    description: Routes to manage consumers
  - name: Contact Addresses
    description: Routes to manage contact addresses
  - name: Contacts
    description: Routes to manage contacts
  - name: Fulfillments
    description: Routes to manage fulfillments
  - name: OKC Products
    description: Routes to manage OK Capsule products
  - name: Orders
    description: Routes to manage orders
  - name: Order Lines
    description: Routes to manage order lines
  - name: Pamphlets
    description: Routes to manage pamphlets
  - name: Product Lines
    description: Routes to manage product lines (formerly brands).
  - name: Product Sets
    description: >-
      Routes to manage client product sets (a set is a client product composed
      of other client products)
  - name: Products
    description: Routes to manage client products
  - name: Statuses
    description: List of statuses for resources
  - name: Users
    description: Routes to manage client users
paths:
  /v2/authentication/token:
    post:
      tags:
        - Authentication
      security:
        - bearerAuth: []
      summary: Request access, id, and refresh tokens
      description: >-
        Use username and password to retrieve **access token**, **id token**,
        and **refresh token**. The access token will include permissions based
        on the user's assigned role.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  format: password
                  example: password
              required:
                - username
                - password
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - id_token
                  - refresh_token
                  - token_type
                  - expires_in
                  - permissions
                properties:
                  access_token:
                    type: string
                    example: eyJra1example
                  id_token:
                    type: string
                    example: eyJra1example
                  refresh_token:
                    type: string
                    example: eyJra1example
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: string
                    example: 86400
                  permissions:
                    type: string
                    example: >-
                      orders/read,orders/create,orders/update,orders/delete,products/read,products/create
        '422':
          description: Validation error response.
          content:
            application/json:
              schema:
                type: object
                required:
                  - error
                properties:
                  error:
                    type: object
                    required:
                      - message
                      - errors
                    properties:
                      message:
                        type: string
                        example: Validation error
                      errors:
                        type: array
                        items:
                          type: object
                          properties:
                            message:
                              type: string
                              example: '''username'' is required'
                            type:
                              type: string
                              example: any.required
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
  /v2/authentication/refresh-token:
    post:
      tags:
        - Authentication
      security:
        - bearerAuth: []
      summary: Get new access and id tokens
      description: Use refresh token to retrieve access and id tokens
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                refresh_token:
                  type: string
                  example: eyJra1example
              required:
                - refresh_token
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - access_token
                  - id_token
                  - refresh_token
                  - token_type
                  - expires_in
                properties:
                  access_token:
                    type: string
                    example: eyJra1example
                  id_token:
                    type: string
                    example: eyJra1example
                  token_type:
                    type: string
                    example: Bearer
                  expires_in:
                    type: string
                    example: 86400
        '422':
          $ref: '#/components/responses/422AuthValidationError'
        default:
          $ref: '#/components/responses/UnknownError'
  /v2/authentication/forgot-password:
    post:
      tags:
        - Authentication
      security:
        - bearerAuth: []
      summary: Trigger reset password email or text message
      description: >-
        Trigger reset password email or text message to receive confirmation
        code
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                  example: user@example.com
              required:
                - email
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Confirmation code has been sent to email/phone number ...
        '422':
          $ref: '#/components/responses/422AuthValidationError'
        default:
          $ref: '#/components/responses/UnknownError'
  /v2/authentication/reset-password:
    post:
      tags:
        - Authentication
      security:
        - bearerAuth: []
      summary: Reset password
      description: Use confirmation code to reset password
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                username:
                  type: string
                  example: user@example.com
                password:
                  type: string
                  format: password
                confirmation_code:
                  type: string
              required:
                - username
                - password
                - confirmation_code
      responses:
        '201':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                required:
                  - message
                properties:
                  message:
                    type: string
                    example: Password has been reset
        '422':
          $ref: '#/components/responses/422AuthValidationError'
        default:
          $ref: '#/components/responses/UnknownError'
  /v2/authentication/user:
    get:
      tags:
        - Authentication
      security:
        - bearerAuth: []
      summary: User information
      description: Get information about the user who issued token
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
  /v2/clients:
    post:
      tags:
        - Clients
      security:
        - bearerAuth:
            - clients/write
      summary: Creates a client.
      operationId: createClient
      description: Creates a client record.
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - business_name
              properties:
                business_name:
                  type: string
                  example: Incorporated Company, LLC.
                display_name:
                  type: string
                  example: My Company
                is_test_account:
                  type: boolean
                  example: false
                is_international_shipping_enabled:
                  type: boolean
                  example: false
                onboarding_stage:
                  type: string
                  nullable: true
                  enum:
                    - signup
                    - verification
                    - introduction
                    - brand
                    - contacts
                    - addresses
                    - payment
                    - install_shopify
                    - formulary
                    - solution_packs
                    - pamphlet
                    - labels
                    - packet
                    - product_spec
                    - terms
                    - sla_rules
                    - test_order
                    - complete
                    - login
                    - confirmation_redirect
                  example: signup
                service_level:
                  type: string
                  enum:
                    - Starter
                    - Professional
                    - Enterprise
                  default: Starter
                  example: Starter
                contract_type:
                  type: string
                  enum:
                    - T&C
                    - MSA
                  default: T&C
                  example: T&C
                admin_user:
                  type: object
                  required:
                    - name
                    - email
                  properties:
                    name:
                      type: string
                      example: Example Tester
                    email:
                      type: string
                      format: email
                      example: user@example.com
                    phone_number:
                      type: string
                      example: '+16175551212'
                    locale:
                      type: string
                      pattern: ^[a-z]*-[A-Z]{2}$
                      example: en-US
                address:
                  type: object
                  description: Optional initial address for the client
                  properties:
                    is_default:
                      type: boolean
                      example: true
                    address_type:
                      type: string
                      enum:
                        - shipping
                        - billing
                        - legal
                        - return
                      example: billing
                    addressed_to:
                      type: string
                      maxLength: 35
                    address1:
                      type: string
                      maxLength: 100
                      example: 742 Evergreen Terrace
                    address2:
                      type: string
                      maxLength: 100
                    city:
                      type: string
                      maxLength: 50
                      example: Springfield
                    province_name:
                      type: string
                      maxLength: 30
                    country_name:
                      type: string
                      example: United States
                    postal_code:
                      type: string
                      maxLength: 10
                    phone_number:
                      type: string
                      maxLength: 15
                is_brand_remap_enabled:
                  type: boolean
                  default: false
                  example: false
                  description: >-
                    When enabled, allows brand remapping for this client's
                    products.
                status:
                  type: string
                  enum:
                    - Active
                    - Inactive
                    - Onboarding
                  default: Onboarding
                  x-internal: true
                  description: Internal use only - defaults to Onboarding.
                user_type:
                  type: string
                  enum:
                    - client
                    - internal
                  x-internal: true
                  description: Internal use only.
                max_user_count:
                  type: integer
                  minimum: 1
                  example: 5
                  x-internal: true
                  description: Internal use only - filtered out for client users.
                crm_account_id:
                  type: string
                  example: ABCDabcd123
                  x-internal: true
                  description: Internal use only - filtered out for client users.
            examples:
              ClientFullSample:
                $ref: '#/components/examples/ClientFullSample'
              ClientRequiredSample:
                $ref: '#/components/examples/ClientRequiredSample'
      responses:
        '201':
          description: Returns a created Client object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client:
                    $ref: '#/components/schemas/Client'
                  admin_user:
                    $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/422ValidationError'
        default:
          $ref: '#/components/responses/UnknownError'
    get:
      tags:
        - Clients
      security:
        - bearerAuth:
            - clients/read
      summary: List all clients.
      operationId: listClients
      description: |
        List all clients a user has access to.

        Filterable fields:
         * status
         * business_name
         * display_name
         * crm_id

        Sortable fields:
        * display_name
        * business_name
      parameters:
        - $ref: '#/components/parameters/LimitParameters'
        - $ref: '#/components/parameters/CursorParameters'
        - $ref: '#/components/parameters/SortByParameters'
        - $ref: '#/components/parameters/QueryParameters'
      responses:
        '200':
          description: Search results matching criteria
          content:
            application/json:
              schema:
                required:
                  - clients
                properties:
                  clients:
                    type: array
                    items:
                      $ref: '#/components/schemas/Client'
        default:
          $ref: '#/components/responses/UnknownError'
  /v2/clients/{id}:
    get:
      tags:
        - Clients
      security:
        - bearerAuth:
            - clients/read
      summary: Retrieve a client.
      operationId: getClient
      description: Retrieves a client by id.
      parameters:
        - $ref: '#/components/parameters/IdParameter'
      responses:
        '200':
          description: Returns the Client object for a valid identifier.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client:
                    $ref: '#/components/schemas/Client'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
    put:
      tags:
        - Clients
      security:
        - bearerAuth:
            - clients/write
      summary: Update a client.
      operationId: updateClient
      description: Update Client object.
      parameters:
        - $ref: '#/components/parameters/IdParameter'
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                business_name:
                  type: string
                  example: Incorporated Company, LLC.
                display_name:
                  type: string
                  example: My Company
                crm_account_id:
                  type: string
                  example: ABCDabcd123
                  x-internal: true
                  description: Internal use only - filtered out for client users.
                status:
                  type: string
                  enum:
                    - Active
                    - Inactive
                    - Onboarding
                  example: Active
                  x-internal: true
                  description: Internal use only - filtered out for client users.
                onboarding_stage:
                  type: string
                  nullable: true
                  enum:
                    - signup
                    - verification
                    - introduction
                    - brand
                    - contacts
                    - addresses
                    - payment
                    - install_shopify
                    - formulary
                    - solution_packs
                    - pamphlet
                    - labels
                    - packet
                    - product_spec
                    - terms
                    - sla_rules
                    - test_order
                    - complete
                    - login
                    - confirmation_redirect
                    - billing_address
                    - packaging
                    - product_customization
                    - categories
                    - creating_drafts
                    - shipping_tracking
                  example: signup
                max_user_count:
                  type: integer
                  minimum: 0
                  example: 5
                  x-internal: true
                  description: Internal use only - filtered out for client users.
                is_test_account:
                  type: boolean
                  example: false
                is_international_shipping_enabled:
                  type: boolean
                  example: false
                tax_id:
                  type: string
                  example: 001-999-874
                business_contact_firstname:
                  type: string
                  example: John
                business_contact_lastname:
                  type: string
                  example: Doe
                business_contact_email:
                  type: string
                  format: email
                  example: johndoe@email.com
                billing_contact_firstname:
                  type: string
                  example: Jane
                billing_contact_lastname:
                  type: string
                  example: Smith
                billing_contact_address_id:
                  type: string
                  format: uuid
                  example: dc6fcff9-0464-4c03-9bb9-e90812361a66
                service_level:
                  type: string
                  enum:
                    - Starter
                    - Professional
                    - Enterprise
                  example: Starter
                contract_type:
                  type: string
                  enum:
                    - T&C
                    - MSA
                  example: T&C
                stripe_customer_id:
                  type: string
                  example: cus_abc123
                payment_session_id:
                  type: string
                  nullable: true
                  example: pi_abc123
                is_brand_remap_enabled:
                  type: boolean
                  example: false
                  description: >-
                    When enabled, allows brand remapping for this client's
                    products.
      responses:
        '200':
          description: Returns the updated client.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client:
                    $ref: '#/components/schemas/Client'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: Validation error response.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
    delete:
      tags:
        - Clients
      security:
        - bearerAuth:
            - clients/write
      summary: Delete a client.
      operationId: deleteClient
      description: Delete a Client object.
      parameters:
        - $ref: '#/components/parameters/IdParameter'
      responses:
        '204':
          description: Confirms deletion of a client.
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
  /v2/addresses:
    post:
      tags:
        - Client Addresses
      security:
        - bearerAuth:
            - addresses/write
      summary: Creates an address for a client.
      operationId: createClientAddress
      description: Creates and address for a client.
      parameters:
        - &ref_1
          in: query
          name: q
          description: >-
            For internal users only. Use Query DSL *query_string* syntax to send
            client id.
          schema:
            type: string
      requestBody:
        content:
          application/json:
            schema: &ref_0
              type: object
              required:
                - address1
                - city
                - country_name
              properties:
                is_default:
                  type: boolean
                  example: true
                address_type:
                  type: string
                  enum:
                    - shipping
                    - billing
                    - legal
                    - return
                  example: shipping
                addressed_to:
                  type: string
                  example: Homer Simpson
                address1:
                  type: string
                  example: 742 Evergreen Terrace
                  maxLength: 100
                  description: Will be abbreviated/wrapped for shipping labels if needed
                address2:
                  type: string
                  example: Apt. 23
                  maxLength: 100
                  description: Will be abbreviated/wrapped for shipping labels if needed
                city:
                  type: string
                  example: Springfield
                  maxLength: 50
                province_name:
                  type: string
                  nullable: true
                  example: Ohio
                  description: Optional - will be validated against country
                country_name:
                  type: string
                  example: United States
                postal_code:
                  type: string
                  nullable: true
                  example: '45501'
                phone_number:
                  type: string
                  format: E.164
                  example: '+12133734253'
                  description: Required if address_type is 'return'
            examples:
              AddressFullSample:
                $ref: '#/components/examples/AddressFullSample'
              AddressRequiredSample:
                $ref: '#/components/examples/AddressRequiredSample'
      responses:
        '201':
          description: Returns created Address object.
          content:
            application/json:
              schema:
                type: object
                required:
                  - address
                properties:
                  address:
                    $ref: '#/components/schemas/Address'
        '422':
          $ref: '#/components/responses/422ValidationError'
        default:
          $ref: '#/components/responses/UnknownError'
    get:
      tags:
        - Client Addresses
      security:
        - bearerAuth:
            - addresses/read
      summary: Retrieves a collection of Client Addresses.
      operationId: listClientAddresses
      description: |
        List all client addresses.

        Filterable fields:
         * ALL
      parameters:
        - $ref: '#/components/parameters/LimitParameters'
        - $ref: '#/components/parameters/CursorParameters'
        - $ref: '#/components/parameters/SortByParameters'
        - $ref: '#/components/parameters/QueryParameters'
      responses:
        '200':
          description: search results matching criteria
          content:
            application/json:
              schema:
                required:
                  - addresses
                properties:
                  addresses:
                    type: array
                    items:
                      $ref: '#/components/schemas/Address'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
  /v2/addresses/count:
    get:
      tags:
        - Client Addresses
      security:
        - bearerAuth:
            - addresses/read
      summary: Count of all addresses
      operationId: getAddressTotalCount
      description: |
        Count of all addresses.

        Filterable fields:
        * ALL
      parameters:
        - $ref: '#/components/parameters/QueryParameters'
      responses:
        '200':
          description: Search results matching criteria
          content:
            application/json:
              schema:
                type: object
                $ref: '#/components/schemas/Count'
        default:
          $ref: '#/components/responses/UnknownError'
  /v2/addresses/{id}:
    get:
      tags:
        - Client Addresses
      security:
        - bearerAuth:
            - addresses/read
      summary: Retrieve a client address
      operationId: getClientAddress
      description: Retrieve client's address by id
      parameters:
        - $ref: '#/components/parameters/IdParameter'
      responses:
        '200':
          description: Returns the Address object for a valid identifier.
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    $ref: '#/components/schemas/Address'
        default:
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorModel'
          description: Error response.
    put:
      tags:
        - Client Addresses
      security:
        - bearerAuth:
            - address/write
      summary: Update client's address
      operationId: updateClientAddress
      description: Update client's address
      parameters:
        - $ref: '#/components/parameters/IdParameter'
      requestBody:
        content:
          application/json:
            schema: *ref_0
      responses:
        '200':
          description: Returns the updated Address object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  address:
                    $ref: '#/components/schemas/Address'
        '422':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationError'
          description: Validation error response.
