  /v2/product-sets:
    post:
      tags:
        - Product Sets
      security:
        - bearerAuth:
            - products/write
      summary: Create a product set
      operationId: createClientProductSet
      description: >-
        Creates a new client product set with its member items. All
        `client_product_id` values must already exist.
      parameters:
        - *ref_1
      requestBody:
        description: Product set to create
        content:
          application/json:
            schema:
              type: object
              required:
                - client_set_id
                - set_items
              properties:
                client_set_id:
                  type: string
                  format: uuid
                  description: The client product UUID that acts as the parent set.
                  example: d290f1ee-6c54-4b01-90e6-d701748f0851
                created_by:
                  type: string
                  format: uuid
                  nullable: true
                  example: d290f1ee-6c54-4b01-90e6-d701748f0851
                updated_by:
                  type: string
                  format: uuid
                  nullable: true
                  example: d290f1ee-6c54-4b01-90e6-d701748f0851
                set_items:
                  type: array
                  description: List of client products to include in the set.
                  items:
                    type: object
                    required:
                      - client_product_id
                      - quantity
                    properties:
                      client_product_id:
                        type: string
                        format: uuid
                        description: The client product UUID to add to the set.
                        example: a1b2c3d4-1234-5678-90ab-cdef01234567
                      quantity:
                        type: number
                        description: Quantity of this product in the set.
                        example: 2
      responses:
        '200':
          description: Returns the created product set with its items.
          content:
            application/json:
              schema:
                type: object
                properties:
                  client_set_id:
                    type: string
                    format: uuid
                    example: d290f1ee-6c54-4b01-90e6-d701748f0851
                  set_items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ClientProductSetItem'
        '422':
          $ref: '#/components/responses/422ValidationError'
        default:
          $ref: '#/components/responses/UnknownError'
