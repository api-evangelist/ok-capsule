    post:
      tags:
        - Users
      security:
        - bearerAuth:
            - users/write
      summary: Creates a user.
      operationId: createUser
      description: Creates a user.
      parameters:
        - *ref_1
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - email
                - roles
              properties:
                name:
                  type: string
                  description: Full name of the user
                  example: Homer Simpson
                email:
                  type: string
                  format: email
                  description: Email address (used for login)
                  example: homer@springfield.com
                roles:
                  type: array
                  description: User roles (at least one required)
                  minItems: 1
                  items:
                    type: string
                    enum:
                      - Client_Admin
                      - Client_Manager
                      - Client_Developer
                      - Client_User
                      - Internal_Admin
                      - Internal_Manager
                      - Internal_Developer
                      - Internal_User
                  example:
                    - Client_Manager
                phone_number:
                  type: string
                  format: E.164
                  nullable: true
                  description: Phone number in E.164 format
                  example: '+12133734253'
                locale:
                  type: string
                  nullable: true
                  pattern: ^[a-z]*-[A-Z]{2}$
                  description: User locale preference (e.g., en-US)
                  example: en-US
              example:
                name: Homer Simpson
                email: homer@springfield.com
                roles:
                  - Client_Manager
              x-examples:
                required-only:
                  summary: Create user with required fields only
                  value:
                    name: Homer Simpson
                    email: homer@springfield.com
                    roles:
                      - Client_Manager
                complete:
                  summary: Create user with all fields
                  value:
                    name: Homer Simpson
                    email: homer@springfield.com
                    roles:
                      - Client_Admin
                      - Client_Manager
                    phone_number: '+12133734253'
                    locale: en-US
            examples:
              UserFullSample:
                $ref: '#/components/examples/UserFullSample'
              UserRequiredSample:
                $ref: '#/components/examples/UserRequiredSample'
      responses:
        '201':
          description: Returns a created User object.
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
        '422':
          $ref: '#/components/responses/422ValidationError'
        default:
          $ref: '#/components/responses/UnknownError'
    get:
      tags:
        - Users
      security:
        - bearerAuth:
            - users/read
      summary: List all users
      operationId: listUsers
      description: |
        List all users.

        Filterable fields:
        * name
        * email
      parameters:
        - $ref: '#/components/parameters/LimitParameters'
        - $ref: '#/components/parameters/CursorParameters'
        - $ref: '#/components/parameters/SortByParameters'
        - $ref: '#/components/parameters/QueryParameters'
      responses:
