components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    422ValidationError:
      description: Validation error response.
      content:
        application/json:
          schema: &ref_13
            type: object
            title: Validation Error
            required:
              - message
              - errors
            description: >-
              A validation error response from the OK Capsule API (Joi
              validation)
            properties:
              message:
                description: >-
                  A human-readable message indicating a validation error
                  occurred.
                maxLength: 40000
                type: string
                example: Validation error
              errors:
                description: An array of validation errors from Joi schema validation
                type: array
                items:
                  type: object
                  required:
                    - message
                    - type
                  properties:
                    message:
                      description: >-
                        A human-readable message providing more details about
                        the validation error.
                      type: string
                      example: '''business_name'' is required'
                    type:
                      description: The Joi validation type that failed.
                      type: string
                      example: any.required
    422AuthValidationError:
      description: >-
        Validation error response from authentication endpoints (gateway
        service)
      content:
        application/json:
          schema:
            type: object
            required:
              - error
            properties:
              error:
                type: object
                required:
                  - message
                  - errors
                properties:
                  message:
                    type: string
                    example: Validation error
                  errors:
                    type: array
                    items:
                      type: object
                      required:
                        - message
                        - type
                      properties:
                        message:
                          type: string
                          example: '''username'' is required'
                        type:
                          type: string
                          example: any.required
    204ConfirmDeletion:
      description: Confirms resource deletion.
    UnknownError:
      description: Error response.
      content:
        application/json:
          schema: &ref_12
            title: Error Model
            description: An error response from the OK Capsule API
            type: object
            properties:
              error:
                title: Error Model Content
                type: object
                description: Error details object
                required:
                  - message
                properties:
                  errorCode:
                    description: >-
                      For some errors that could be handled programmatically, a
                      short string indicating the error code.
                    maxLength: 5000
                    type: string
                    example: RESOURCE_NOT_FOUND
                  message:
                    description: >-
                      A human-readable message providing more details about the
                      error.
                    maxLength: 40000
                    type: string
                    example: The requested resource was not found
              message:
                description: Top-level error message (present in some error responses)
                type: string
                example: Internal Server Error
            required:
              - error
    UnauthorizedError:
      description: Authentication information is missing or invalid
      content:
        application/json:
          schema:
            properties:
              error:
                properties:
                  message:
                    type: string
                    example: Unauthorized
                required:
                  - message
                type: object
            required:
              - error
            type: object
  schemas:
    User:
      allOf:
        - type: object
          required:
            - id
            - client_id
          properties:
            id:
              type: string
              format: uuid
              readOnly: true
              example: d290f1ee-6c54-4b01-90e6-d701748f0851
            client_id:
              type: string
              format: uuid
              nullable: true
              example: d290f1ee-6c54-4b01-90e6-d701748f0851
            user_type:
