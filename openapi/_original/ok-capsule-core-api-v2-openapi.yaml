          $ref: '#/components/responses/UnknownError'
    put:
      tags:
        - Product Sets
      security:
        - bearerAuth:
            - products/write
      summary: Update a product set
      operationId: updateClientProductSet
      description: >-
        Add, update, or remove items from an existing product set in a single
        request.
      parameters:
        - name: client_set_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the client product acting as the set.
          example: d290f1ee-6c54-4b01-90e6-d701748f0851
        - *ref_1
      requestBody:
        description: Items to add, update, or delete within the set.
        content:
          application/json:
            schema:
              type: object
              properties:
                created_by:
                  type: string
                  format: uuid
                  nullable: true
                  example: d290f1ee-6c54-4b01-90e6-d701748f0851
                updated_by:
                  type: string
                  format: uuid
                  nullable: true
                  example: d290f1ee-6c54-4b01-90e6-d701748f0851
                items_to_add:
                  type: array
                  description: New client products to add to the set.
                  items:
                    type: object
                    required:
                      - client_product_id
                      - quantity
                    properties:
                      client_product_id:
                        type: string
                        format: uuid
                        example: a1b2c3d4-1234-5678-90ab-cdef01234567
                      quantity:
                        type: number
                        example: 1
                items_to_update:
