    post:
      tags:
        - Orders
      security:
        - bearerAuth:
            - orders/write
      summary: Creates an order.
      operationId: createOrder
      description: >-
        Creates an order. Please note that pouches cannot contain more than 8
        supplements per time of administration.
      parameters:
        - *ref_1
      requestBody:
        content:
          application/json:
            schema: &ref_5
              type: object
              required:
                - consumer
                - shipping_address
                - order_lines
              properties:
                consumer:
                  type: object
                  description: >-
                    Consumer info - provide either 'id' for existing consumer,
                    or 'first_name'/'last_name' to create/update
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: >-
                        Existing consumer ID (if provided, first_name/last_name
                        are optional)
                      example: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                    first_name:
                      type: string
                      maxLength: 100
                      description: Consumer first name (required if no id provided)
                      example: John
                    last_name:
                      type: string
                      maxLength: 100
                      description: Consumer last name (required if first_name provided)
                      example: Doe
                    email:
                      type: string
                      format: email
                      maxLength: 100
                      example: john.doe@example.com
                    phone_number:
                      type: string
                      nullable: true
                      maxLength: 15
                      example: '+12133734253'
                shipping_address:
                  type: object
                  required:
                    - address1
                    - city
                    - country_name
                  properties:
                    addressee:
                      type: string
                      maxLength: 200
                      nullable: true
                      description: Name on shipping label (defaults to consumer name)
                      example: John Doe
                    address1:
                      type: string
                      maxLength: 100
                      description: Street address line 1
                      example: 742 Evergreen Terrace
                    address2:
                      type: string
                      maxLength: 100
                      nullable: true
                      example: Apt 2B
                    city:
                      type: string
                      maxLength: 50
                      example: Springfield
                    province_name:
                      type: string
                      nullable: true
                      example: Illinois
                    country_name:
                      type: string
                      example: United States
                    postal_code:
                      type: string
                      nullable: true
                      example: '62701'
                order_lines:
                  type: array
                  description: Order lines - each represents a pack/pouch configuration
                  items:
                    type: object
                    required:
                      - pouches
                    properties:
                      name:
                        type: string
                        nullable: true
                        description: Order line name
                        example: Monthly Wellness Pack
                      physician_name:
                        type: string
                        maxLength: 30
                        nullable: true
                        example: Dr. Smith
                      custom_text_1:
                        type: string
