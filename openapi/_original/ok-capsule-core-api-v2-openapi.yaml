servers:
  - description: Production environment
    url: https://na1-prod.okcapsule.app
  - description: Stage/Testing environment
    url: https://na1-stage.okcapsule.app
info:
  description: >-
    ## Overview


    The OK Capsule API enables you to programmatically create supplement orders,
    manage consumers, and track shipments. It is a REST API that accepts JSON
    requests, returns JSON responses, and uses standard HTTP methods and status
    codes.


    **All requests must be made over HTTPS.**


    📚 **Additional Resources:** [Getting Started
    Guide](https://docs.okcapsule.app/docs/getting-started) | [Recipes &
    Examples](https://docs.okcapsule.app/docs/category/recipes)


    ## Getting Started


    > **New to OK Capsule API?** Account and brand setup must be completed
    before contacting OK Capsule about API credentials. If you have not set up
    your account and brand yet, start with the [Getting Started
    Guide](https://docs.okcapsule.app/docs/getting-started) before proceeding.


    1. **Set up your account** - Your OK Capsule account must be created and
    active

    2. **Set up your brand** - At least one Product Line must be configured in
    your account

    3. **Contact OK Capsule about API credentials** - Reach out to your OK
    Capsule representative once account and brand setup are complete

    4. **Authenticate** - POST to `/v2/authentication/token` to get an access
    token

    5. **List products** - GET `/v2/products` to see available supplements

    6. **Create an order** - POST to `/v2/orders` with consumer and product
    details

    7. **Track fulfillment** - Monitor order status and shipping via
    `/v2/orders` and `/v2/fulfillments`


    ## Environments


    | Environment | Purpose | Notes |

    |-------------|---------|-------|

    | **Production** | Live orders | Real fulfillment and shipping |

    | **Stage** | Testing | Test data only, no real shipments |


    ⚠️ Users and data are environment-specific. Stage credentials do not work in
    Production.


    ## Core Concepts


    | Term | Route | Description |

    |------|-------|-------------|

    | **Client** | `/v2/clients` | Your organization (business partner
    submitting orders) |

    | **Consumer** | `/v2/consumers` | Your end customer who receives
    supplements |

    | **Product** | `/v2/products` | A client-specific instance of an OKC
    Product with custom branding |

    | **Order** | `/v2/orders` | A request to fulfill supplements for a consumer
    |

    | **Order Line** | — | A set of pouches within an order (e.g., 30-day
    supply) |

    | **Pouch** | — | An individual daily packet of supplements |

    | **Fulfillment** | `/v2/fulfillments` | Shipping, tracking, and delivery
    information for an order |

    | **Assembly** | `/v2/assemblies` | A client's predefined bundle of products
    (commonly called a "pack") |

    | **Product Line** | `/v2/product-lines` | A client's marketing brand
    (appears on packaging) |

    | **OKC Product** | — | A supplement in the OK Capsule master catalog (what
    OKC purchases from vendors) |

    | **User** | `/v2/users` | An authorized person who accesses the API or
    portal |

    | **Contact** | `/v2/contacts` | A person associated with a client, managed
    for communication purposes |
