                  type: string
                  enum:
                    - sm
                    - lg
                  default: sm
                  description: Pamphlet template size
                label_group_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Label group reference
                pamphlet_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Pamphlet asset reference
                label_large_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Large label asset reference
                label_small_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Small label asset reference
                pouch_template_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Pouch template reference
                pouch_logo_proxy:
                  type: string
                  nullable: true
                  description: Proxy URL for pouch logo
                sku:
                  type: string
                  nullable: true
                  description: SKU for this asset group
                  example: PAG-001
                display_name:
                  type: string
                  nullable: true
                  description: Display name
                  example: Premium Wellness Pack
                custom_template_name:
                  type: string
                  nullable: true
                  description: Custom template name
                max_pouch_count:
                  type: integer
                  default: 30
                  description: Maximum pouches per pack
                  example: 30
