                fulfillment_okc_product_ids:
                  type: array
                  description: >-
                    OKC product IDs for fulfillment boxes (at least one
                    required)
                  minItems: 1
                  items:
                    type: string
                    format: uuid
                  example:
                    - d290f1ee-6c54-4b01-90e6-d701748f0851
                pamphlet_cover_image:
                  type: string
                  format: binary
                  description: Cover page image file
                pamphlet_inside_cover_image:
                  type: string
                  format: binary
                  description: Inside cover image file
                pamphlet_back_image:
                  type: string
                  format: binary
                  description: Back cover image file
                sleeve_label_large_file:
                  type: string
                  format: binary
                  nullable: true
                  description: Large sleeve label file
                sleeve_label_small_file:
                  type: string
                  format: binary
                  nullable: true
                  description: Small sleeve label file
                pouch_label_file:
                  type: string
                  format: binary
                  nullable: true
                  description: Pouch label file
