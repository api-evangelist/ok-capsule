generated: '2026-08-26'
method: searched
source: https://docs.okcapsule.app/docs/getting-started
sources:
- https://docs.okcapsule.app/docs/getting-started
- https://docs.okcapsule.app/docs/recipes/troubleshooting
- https://okcapsule.com/mcp/developers
