mcp_only:
- tool: okc_authenticate
  reason: >-
    MCP session establishment over OAuth 2.1. The REST equivalent is a different auth model entirely —
    POST /v2/authentication/token with username and password (no operationId in the spec).
- tool: okc_debug_ping
  reason: No REST health or ping operation is published.
- tool: okc_confirm_pending_action
  reason: >-
    A protocol-level two-step confirmation gate for destructive tools. REST has no equivalent; the REST
    surface simply rejects a cancel or delete once the order has moved past Pending/On Hold.
- tool: okc_get_product_intelligence
  reason: >-
    Ingredient and product intelligence has no public REST operation. getProduct and getOkcProduct
    return catalog records, not the interaction/claims intelligence the tool describes.
- tool: okc_validate_recommendation
  reason: >-
    Supplement recommendation validation has no REST counterpart; it appears to be an MCP-native
    capability built for the agent surface.
