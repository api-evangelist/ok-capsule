embedded_ui:
  supported: true
  tools:
  - okc_render_pack_builder
  - okc_render_order_status
  note: >-
    Both return embedded UI cards. Some MCP clients render them, others fall back to text; the provider
    states both paths carry the same data.
environments:
- name: production
  status: live
  host: storefront.okcapsule.app
  note: the only self-serve environment
- name: staging
  status: by arrangement only
  note: periodically reset; no self-serve MCP sandbox today
published_limitations:
- No consumer-facing sign-in — every token belongs to brand staff.
- No client_credentials grant; no unattended machine-to-machine path.
- No self-serve sandbox for the MCP surface.
- The MCP tools are the supported contract; the underlying REST endpoints are reference-only and can change without notice.
- Tool schemas must be discovered at runtime with tools/list, not hardcoded.
- The scope list is not final and will grow.
- No unattended sessions beyond the 30-day refresh window.
- Embedded UI cards do not render in every MCP client.
