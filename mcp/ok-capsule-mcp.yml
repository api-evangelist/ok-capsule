generated: '2026-08-26'
method: probed
source: https://okcapsule.com/mcp/developers
status: live
name: OK Capsule MCP Server
description: >-
  A production remote MCP server that exposes the OK Capsule supplement platform — brands and catalog,
  product intelligence, the pack builder, recommendation validation, consumers, orders and fulfillments
  — as OAuth 2.1 scoped tools to any conformant MCP host. OK Capsule markets it as the operating
  surface for the business: "Run your brand from an AI assistant."
deployment:
  mode: remote
  endpoint: https://storefront.okcapsule.app/mcp
  auth: oauth
  verified: probed
transport:
  protocol: Streamable HTTP JSON-RPC
  authorization_header: 'Authorization: Bearer <access token>'
x-evidence:
  fetched: '2026-08-26'
  probe: 'POST https://storefront.okcapsule.app/mcp {"jsonrpc":"2.0","id":1,"method":"tools/list"}'
  http_status: 401
  body: '{"error":"missing_bearer","error_description":"401 Unauthorized: missing bearer"}'
  www_authenticate: >-
    Bearer realm="https://storefront.okcapsule.app/mcp",
    resource_metadata="https://storefront.okcapsule.app/.well-known/oauth-protected-resource/mcp"
  note: >-
    tools/list is auth-gated and returns an RFC 9728-conformant challenge pointing at the protected
    resource metadata document, so the live inputSchema for each tool requires an authenticated
    introspection. The tool list below is the provider's own published catalog from
    https://okcapsule.com/mcp/developers — names, scopes and purposes are verbatim; input schemas are
    NOT recorded because they were not observed. OK Capsule explicitly tells integrators to discover
    them at runtime: "Call tools/list rather than hardcoding schemas."
discovery:
  oauth_authorization_server: https://storefront.okcapsule.app/.well-known/oauth-authorization-server
  oauth_protected_resource: https://storefront.okcapsule.app/.well-known/oauth-protected-resource
  jwks_uri: https://storefront.okcapsule.app/.well-known/jwks.json
authentication:
  model: OAuth 2.1 authorization_code + PKCE (S256 mandatory)
  dynamic_client_registration: true
  registration_endpoint: https://storefront.okcapsule.app/oauth/register
  client_type: public — no client secrets are issued
  grant_types:
  - authorization_code
  - refresh_token
  machine_to_machine: false
  machine_to_machine_note: >-
    No client_credentials grant. A human staff member signs in with an email one-time code; there is no
    unattended machine-to-machine path today, and no consumer-facing sign-in — every token belongs to
    brand staff.
  access_token: RS256 JWT, 1 hour, carries sub/role/email/tenant_id/tenant_slug/scope
  refresh_token: 30 days, single-use, rotating
  tenancy: one token is bound to exactly one workspace
install_paths:
- client: Claude / claude.ai / Claude Desktop
  method: Settings -> Connectors -> Add custom connector -> paste https://storefront.okcapsule.app/mcp
- client: Claude Code
  method: claude mcp add --transport http okcapsule https://storefront.okcapsule.app/mcp
- client: Cursor
  method: one-click deep link from https://okcapsule.com/mcp/developers
- client: VS Code
  method: one-click deep link (requires VS Code 1.101+ with MCP enabled)
- client: ChatGPT / Gemini / Perplexity
  method: per-assistant guides at https://okcapsule.com/mcp/{chatgpt,gemini,perplexity}
