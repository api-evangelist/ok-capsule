  note: >-
    No correlation or request-id header is declared or documented. The error-handling recipe advises
    "Log request/response - include correlation IDs for support tickets", but the API does not issue
    one, so the caller must generate and retain it themselves. Support escalation asks for the request
    URL, body, full error response and timestamp instead.
