  exhaustion_status: 429
  detail: rate-limits/ok-capsule-rate-limits.yml
idempotency:
  supported: false
  status: absent
  header: null
  evidence: >-
    The string "idempoten" appears nowhere in the 540KB OpenAPI or in any published documentation page.
    No idempotency key header is defined on any of the 69 write operations, and the docs' retry guidance
    (blind exponential backoff on 429, and automatic retry of createOrder after a 401 refresh) will
    double-fire a real order if the first request in fact succeeded.
  consequence: >-
    This is a physical-fulfillment API. A duplicate POST /v2/orders is a second box of supplements
    manufactured and shipped, and it is chargeable. `clientCustomOrderId` plus
    getOrderByClientCustomId gives a caller a way to build their own dedupe check before retrying,
    but it is a read-then-write race, not idempotency.
  na: false
dry_run_mode:
  supported: false
  status: absent
  note: >-
    No preview, validate-only or dry-run flag exists on any write operation. The nearest published
    substitutes are the stage environment (na1-stage.okcapsule.app, no real shipments) and, on the MCP
    surface, okc_validate_recommendation - which validates a supplement recommendation, not a
    prospective order.
reversibility:
  status: verified
  grade: verified
  note: >-
    Order cancellation is a genuine reversal with a hard, published, time-bounded window - and the
    window is stated in wall-clock terms, not vaguely. Consumer deletion is reversible-in-effect only
    at the MCP layer, via a mandatory confirmation gate rather than an undo.
  write_surfaces:
  - surface: Order creation
    create: createOrder (POST /v2/orders)
    reversal: 'updateOrder (PUT /v2/orders/{id}) with {"status": "Canceled by Client"}'
    mcp_tool: okc_cancel_order (scope orders:cancel, opt-in)
    window: >-
      Only while the order is in Pending or On Hold status. Orders move from Pending to Accepted in the
      nightly batch at midnight PST, so the practical window is until the next midnight PST after
      submission. Once Accepted, cancellation requires contacting OK Capsule support. Once In
      Production, the order cannot be canceled at all.
    window_source: https://docs.okcapsule.app/docs/recipes/order-lifecycle
    grade: verified
    confirmation: >-
      On the MCP surface okc_cancel_order is destructive and requires a second explicit step via
      okc_confirm_pending_action.
  - surface: Order modification
    update: updateOrder (PUT /v2/orders/{id})
    reversal: re-issue updateOrder with the prior values
    window: >-
      Same window as cancellation - Pending or On Hold only. Editable fields are shipping_address,
      consumer, order_lines, email, phone_number, note and a restricted status transition. total,
      discount_total, fulfillment_fee_total, shipping_fee_total, state, submission_date, source and
      crm_id are read-only to clients. Updating may itself push the order to On Hold if the change
      needs review.
    window_source: https://docs.okcapsule.app/docs/recipes/order-lifecycle
    grade: verified
  - surface: Consumer deletion
    delete: deleteConsumer (DELETE /v2/consumers/{id})
    mcp_tool: okc_delete_consumer (scope consumers:delete, opt-in)
    reversal: none published
    window: null
    grade: none
    note: >-
      No restore, undelete or soft-delete retention period is documented. The only protection is
      preventive: the scope is opt-in and the MCP tool requires okc_confirm_pending_action before it
      fires. An agent should treat consumer deletion as permanent.
  - surface: Consumer / address / contact / product writes
    reversal: re-issue the corresponding PUT with prior values
    window: unbounded
    grade: documented
    note: Ordinary mutable records; there is no versioning or history endpoint to restore from, so the caller must hold the prior state.
  read_only: false
  audit_trail:
    operations: [listOrderTransactionLogs, oneOrderTransactionLogs]
    mcp_tool: okc_list_order_transaction_logs
    note: >-
      /v2/order-transaction-logs gives an order event history, which is what an agent would read to
      establish what actually happened before or after a reversal attempt.
consequence_signals:
  destructive_tools_gated: >-
    On the MCP surface, orders:cancel and consumers:delete are opt-in scopes excluded from the default
    grant, and both backing tools require okc_confirm_pending_action. This is a genuine two-layer
    consequence control and it is unusually well built for a provider of this size.
  physical_consequence: >-
    Writes on this API manufacture and ship physical goods and bill for them. There is no test mode on
    production; the separation is by environment (na1-stage vs na1-prod), not by key prefix.
