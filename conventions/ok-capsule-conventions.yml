auth:
  rest: Bearer JWT from POST /v2/authentication/token (username + password), 24h TTL, refresh via POST /v2/authentication/refresh-token
  mcp: OAuth 2.1 authorization_code + PKCE S256, staff email one-time code, 1h access JWT, 30-day rotating refresh
  detail: authentication/ok-capsule-authentication.yml
versioning:
  style: path
  current: /v2/
  required: true
  note: An unversioned path on the API host returns HTTP 400 "API version is incorrect or not specified".
  detail: lifecycle/ok-capsule-lifecycle.yml
media_type:
  request: application/json
  response: application/json
  note: All 300 declared response bodies in the contract are application/json. No alternative representations.
identifiers:
  style: uuid
  note: >-
    Every resource id is a UUID (format uuid in the schemas, example
    d290f1ee-6c54-4b01-90e6-d701748f0851). There are no typed id prefixes. Orders additionally carry a
    caller-supplied `clientCustomOrderId` retrievable via GET
    /v2/orders/by-client-order-id/{clientCustomOrderId} (getOrderByClientCustomId) - the closest thing
    the API has to a client-side correlation key.
timestamps:
  style: RFC 3339 / ISO 8601 UTC
  fields: [created_at, updated_at]
  note: created_at and updated_at are readOnly on every resource, example 2023-03-20T09:12:28Z.
pagination:
  declared_in_spec: false
  documented: partial
  style: undocumented
  evidence: >-
    No pagination parameter is declared on any of the 199 operations. The order-lifecycle recipe
    demonstrates `limit=50` and `filter[status]=Shipped` / `filter[updated_at][gte]=<iso>` query
    strings on GET /v2/orders, but neither the parameters nor a next-page cursor or total-count field
    appear in the contract. There is a parallel `/count` operation on most collections
    (getOrderTotalCount, getConsumerTotalCount, getFulfillmentTotalCount, ...) returning a Count
    schema, which is how a caller is expected to size a collection.
  gap: >-
    An agent generating a client from the OpenAPI cannot page a collection at all. This is the single
    largest machine-readability gap in the contract.
filtering:
  free_text: q query parameter, present on 97 operations
  structured: 'filter[field]=value and filter[field][op]=value, demonstrated in the docs but not declared in the spec'
