order_lifecycle:
  source: https://docs.okcapsule.app/docs/recipes/order-lifecycle
  processing: Orders in Pending are processed and moved to Accepted during a nightly batch at midnight PST.
  status_update_cadence: Order statuses are typically updated every 6 hours during business operations.
  statuses:
  - status: Pending
    description: Order received, awaiting nightly batch
    editable: true
    cancelable: true
  - status: On Hold
    description: Paused for review
    editable: true
    cancelable: true
  - status: Accepted
    description: Validated and queued for production
    editable: false
    cancelable: contact support
  - status: In Production
    description: Being manufactured
    editable: false
    cancelable: false
  - status: Shipped
    description: Handed to carrier, tracking available
    editable: false
    cancelable: false
  - status: Delivered
    description: Confirmed delivery
    editable: false
    cancelable: false
  - status: Canceled by Client
    description: The client requested cancellation
  - status: Canceled by OKC
    description: OK Capsule canceled the order
  - status: Needs Changes
    description: 'Validation failed during order processing; check the order note field'
mcp_lifecycle:
  source: https://okcapsule.com/mcp/developers
  stable:
  - The protocol - OAuth 2.1 + PKCE, Streamable HTTP, MCP
  - The discovery URLs
  - The production base URL
  moving:
  - Tool schemas - discover at runtime with tools/list, never hardcode
  - The scope list - "not final and will grow"
  self_description: >-
    The provider labels its own developer page "A deliberate snapshot, not a finished spec" and
    publishes a Known gaps & limitations section. That candour is worth recording as a lifecycle
    signal in its own right.
