versioning:
  scheme: path
  pattern: /v{major}/
  current: v2
  spec_version: 2.0.0
  note: >-
    Version is carried in the URL path. The v2 host also rejects an unversioned path outright -
    https://na1-prod.okcapsule.app/<anything-not-/v2/> returns HTTP 400 "API version is incorrect or
    not specified", so the version is mandatory rather than defaulted.
versions:
- version: v1
  status: retired
  host: https://api.okcapsule.app
  evidence:
    probed: '2026-08-26'
    http_status: 410
    body: >-
      {"error":{"errorCode":"OKCAPI_V1_DEPRECATED","message":"We're sorry, but it looks like this
      endpoint is no longer available. For details on the changes, please visit
      https://docs.okcapsule.app/docs/category/v1-to-v2-migration-guide or contact us at
      clientsuccess@okcapsule.com. We're here to help!"}}
  note: >-
    This is the good version of a sunset: a real HTTP 410 Gone with a machine-readable errorCode, a
    human message, a migration-guide link and a named contact - not a silent 404 and not a redirect
    that quietly changes semantics. Every path on the host returns it uniformly.
  defect: >-
    The migration-guide URL the 410 body advertises,
    https://docs.okcapsule.app/docs/category/v1-to-v2-migration-guide, returns HTTP 404. The one link
    a stranded v1 caller is told to follow is dead. Worth reporting to the provider.
- version: v2
  status: current
  hosts:
  - https://na1-prod.okcapsule.app
  - https://na1-stage.okcapsule.app
  spec: openapi/ok-capsule-core-api-v2-openapi.yaml
deprecation_policy:
  published: partial
  sunset_header: false
  deprecation_header: false
  evidence: >-
    OK Capsule has demonstrably deprecated and sunset a major version, and returns 410 Gone with a
    migration pointer, which is more than most providers do. But there is no published policy document
    stating notice periods, and no RFC 8594 Sunset or Deprecation response headers are declared
    anywhere in the OpenAPI or observed on live responses, so a client cannot detect an upcoming
    retirement programmatically - only an already-completed one.
  contract_stability_statement:
    source: https://okcapsule.com/mcp/developers
    text: >-
      "The MCP tools are the supported contract. The underlying REST endpoints are reference-only and
      can change without notice."
    reading: >-
      This is an explicit no-stability-guarantee on the REST surface. It is unusually candid and it is
      load-bearing for anyone planning a REST integration: the 199-operation OpenAPI is documentation,
      not a promise.
