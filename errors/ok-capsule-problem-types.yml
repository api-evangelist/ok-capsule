generated: '2026-08-26'
method: searched
source: https://docs.okcapsule.app/docs/recipes/error-handling
derived_from: openapi/ok-capsule-core-api-v2-openapi.yaml
format: bespoke-json
rfc9457: false
note: >-
  Not RFC 9457. All 300 declared response bodies are application/json; none is
  application/problem+json, and there is no type/title/detail/instance/status quartet. Three distinct
  error envelopes are in play, which is itself the finding an integrator needs: the OpenAPI declares
  two (ErrorModel and ValidationError) and the docs demonstrate a third. Titles, causes and
  remediation below are taken verbatim from the provider's error-handling and troubleshooting recipes.
envelopes:
- name: ErrorModel
  where: openapi components.schemas.ErrorModel — the `default` response on 189 operations
  shape: '{"error": {"errorCode": "<short programmatic code>", "message": "<human readable>"}, "message": "<top-level, present in some responses>"}'
  example_code: RESOURCE_NOT_FOUND
- name: ValidationError
  where: openapi components.schemas.ValidationError — the 422 response on 83 operations
  shape: '{"message": "Validation error", "errors": [{"message": "''business_name'' is required", "type": "<Joi validation type>"}]}'
  note: Server-side validation is Joi; the `type` field is the Joi rule that failed.
- name: docs-envelope
  where: https://docs.okcapsule.app/docs/recipes/error-handling
  shape: '{"statusCode": 422, "error": "Unprocessable Entity", "message": "Validation failed", "details": [{"field": "consumer.email", "message": "\"email\" must be a valid email"}]}'
  note: >-
    The docs teach `details[]` with a `field` key; the OpenAPI declares `errors[]` with a `type` key.
    They are not the same shape. An agent generating a client from the spec will not parse the shape
    the docs demonstrate, and vice versa. Worth raising with the provider.
