domain_standards:
- id: gs1-upc
  name: GS1 UPC / GTIN product identifier
  conforms: true
  evidence: >-
    The contract carries a first-class UPC resource - /v2/upc-codes with 7 operations
    (listUpcCodes, createUpcCode, getUpcCode, updateUpcCode, deleteUpcCode,
    attachOkcProductToUpcCode, detachOkcProductFromUpcCode) and a components.schemas.UpcCode with a
    required `upc` string (example "012345678905", a 12-digit UPC-A) plus a brand field, attachable to
    an OKC product. This is the retail product-identification standard for the supplement category, and
    a buyer who already speaks GS1 can map OK Capsule's catalog to their own without a bespoke
    connector.
  spec_location: paths./v2/upc-codes, components.schemas.UpcCode
- id: dshea-supplement-facts
  name: US FDA Supplement Facts labeling (21 CFR 101.36)
  conforms: partial
  evidence: >-
    The platform generates Supplement Facts artifacts programmatically - the MCP tool
    okc_generate_supplement_facts_pdf (documents:write) and the REST publication-spec surface
    GET /v2/pub-specs/{orderLineId}/{type}/{format} (pdf|html) plus GET /v2/pamphlets/{orderLineId}.
    OK Capsule markets this as "patent-pending Compliance-as-a-Service" that manages FDA labeling
    requirements. Marked partial rather than true because the contract does not name the regulation or
    expose a structured Supplement Facts schema - it returns a rendered document.
  spec_location: paths./v2/pub-specs/{orderLineId}/{type}/{format}, paths./v2/pamphlets/{orderLineId}
compliance:
  note: >-
    OK Capsule publishes a manufacturing and product-quality compliance program, not an information
    security certification program. No SOC 2, ISO 27001, PCI DSS, HIPAA or FedRAMP attestation is
    published anywhere on the site, and no trust center exists (trust.okcapsule.com does not resolve;
    /trust, /security and /compliance all return 404). The certifications below are real and
    published, and they are the ones that matter to this market - they are the reason a health brand
    can put its own name on the pouch.
  source: https://okcapsule.com/quality
