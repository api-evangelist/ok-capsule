aid: ok-capsule
name: OK Capsule
description: >-
  OK Capsule is an on-demand, private-label supplement manufacturing and fulfillment platform. Health
  brands, telehealth providers, clinics and retailers use it to launch personalized daily vitamin packs
  without minimum order quantities, inventory or upfront deposits. The platform exposes its whole
  supply chain programmatically: a REST Core API V2 (199 operations across clients, consumers, orders,
  order lines, fulfillments, assemblies, batches, billings, product lines, pack builders and UPC codes)
  and a production remote MCP server that publishes the same catalog, pack-building, order and
  fulfillment surface as OAuth 2.1 scoped tools for Claude, ChatGPT, Gemini and other MCP hosts.
  Supplements are manufactured in cGMP-certified, FDA-registered facilities and lot-tested by
  ISO 17025 accredited third-party labs.
image: https://okcapsule.com/og-preview.png
url: https://raw.githubusercontent.com/api-evangelist/ok-capsule/refs/heads/main/apis.yml
x-type: company
x-source: harvest:secondary-market
specificationVersion: '0.20'
created: '2026-08-26'
modified: '2026-08-26'
tags:
- Supplements
- Nutrition
- Health
- Manufacturing
- Fulfillment
- Ecommerce
- Personalization
- Orders
- Shipping
- Agents
- MCP
- Telehealth
maintainers:
- FN: Kin Lane
  email: kin@apievangelist.com
- FN: APIs.json
  email: info@apis.io
apis:
- aid: ok-capsule:ok-capsule-mcp-server
  name: OK Capsule MCP Server
  description: >-
    A production remote MCP server that exposes the OK Capsule platform — catalog, product intelligence,
    pack builder, recommendation validation, consumers, orders and fulfillments — as OAuth 2.1 scoped
    tools to any conformant MCP host. Streamable HTTP JSON-RPC, authorization-code plus PKCE with dynamic
    client registration, no API keys and no machine-to-machine grant: a human staff member signs in with
    an email one-time code and every token is bound to exactly one workspace.
  humanURL: https://okcapsule.com/mcp/developers
  baseURL: https://storefront.okcapsule.app/mcp
  tags:
  - MCP
  - Agents
  - Orders
  - Catalog
  properties:
  - type: MCPServer
    url: mcp/ok-capsule-mcp.yml
  - type: ToolCrosswalk
