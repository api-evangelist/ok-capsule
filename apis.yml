apis:
- aid: ok-capsule:ok-capsule-core-api-v2
  name: OK Capsule Core API V2
  description: >-
    The OK Capsule Core API V2 is a REST API that lets a brand programmatically create supplement
    orders, manage consumers and their addresses, browse the OK Capsule product formulary and its own
    client product catalog, drive the pack builder widget, and track fulfillment and shipping labels
    through to delivery. 199 operations across 121 paths, JSON in and out, bearer JWT authentication,
    with a stage environment mirroring production.
  humanURL: https://docs.okcapsule.app/docs/
  baseURL: https://na1-prod.okcapsule.app
