- aid: ok-capsule:ok-capsule-mcp-server
  name: OK Capsule MCP Server
  description: >-
    A production remote MCP server that exposes the OK Capsule platform — catalog, product
    intelligence, pack builder, recommendation validation, consumers, orders and fulfillments — as
    OAuth 2.1 scoped tools to any conformant MCP host. Streamable HTTP JSON-RPC, authorization-code
    plus PKCE with dynamic client registration, no API keys and no machine-to-machine grant: a human
    staff member signs in with an email one-time code and every token is bound to exactly one
    workspace.
  humanURL: https://okcapsule.com/mcp/developers
  baseURL: https://storefront.okcapsule.app/mcp
