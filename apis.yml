- aid: ok-capsule:ok-capsule-authentication-api
  name: OK Capsule Authentication API
  description: >-
    OK Capsule API uses **Oauth2.0 with OpenID Connect**. It issues **access**, **id**, and **refresh**
    tokens. **Access** tokens is used to authenticate API requests and are short lived (1 day). *Id token**
    can be used by a client application to display user's information. It is also short lived (1 day).  **Refresh**
    token is long lived (10 years) and is used to renew **access** and **id** tokens. Authentication to
    the API is performed via Bearer auth Authorization header: *Authorization: Bearer <access_token>*.
  humanURL: https://docs.okcapsule.app/docs/
  baseURL: https://na1-prod.okcapsule.app
  tags:
  - Authentication
